server {
    listen 3100;
    server_name admin.iigvn.site;
    client_max_body_size 50M;

    root /opt/ai-scoring/frontend/dist;

    location /api/ {
        proxy_pass http://127.0.0.1:5005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Backend-generated media must be served as media, not handled by the SPA
    # fallback. `root` maps /local_audio/file.mp3 to public/local_audio/file.mp3.
    location /local_audio/ { root /opt/ai-scoring/public; }
    location /local_voices/ { root /opt/ai-scoring/public; }
    location /tmp_local/ { root /opt/ai-scoring/public; }
    location /cleaned-audio/ { root /opt/ai-scoring/public; }
    location /dialogues/ { root /opt/ai-scoring/public; }
    location /custom_voices/ { root /opt/ai-scoring/public; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
