server {
    listen 3100;
    server_name admin.iigvn.site;
    client_max_body_size 50M;

    # Exam delivery contains repeated HTML/options and signed media URLs. JSON
    # compression materially reduces the burst when a room starts together.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/json application/problem+json text/plain text/css application/javascript;

    root /opt/ai-scoring-current/frontend/dist;

    location = /health {
        proxy_pass http://127.0.0.1:5005/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # The direct candidate app is deployed from exam-web/dist on a separate
    # virtual host because both applications own routes below /exams.
    # Keep retired event links out of the admin SPA.
    location = /events { return 410; }
    location ^~ /events/ { return 410; }

    # PDF.js ships its worker as an ES module. Ubuntu's default MIME table may
    # not map `.mjs`, causing browsers to reject it as application/octet-stream.
    location ~* \.mjs$ {
        types { application/javascript mjs; }
        try_files $uri =404;
    }

    # Backend-generated media must be served as media, not handled by the SPA
    # fallback. `root` maps /local_audio/file.mp3 to public/local_audio/file.mp3.
    location /local_audio/ { root /opt/ai-scoring-current/public; }
    location /local_voices/ { root /opt/ai-scoring-current/public; }
    location /tmp_local/ { root /opt/ai-scoring-current/public; }
    location /cleaned-audio/ { root /opt/ai-scoring-current/public; }
    location /dialogues/ { root /opt/ai-scoring-current/public; }
    location /custom_voices/ { root /opt/ai-scoring-current/public; }
    location /question-bank-media/ { root /opt/ai-scoring-current/public; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
