name: iig-admin-${DEPLOY_ENV:-beta}

x-app-defaults: &app-defaults
  restart: unless-stopped
  init: true
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

# Release identity is tracked per component so a deploy only recreates the services
# whose image changed (APP_VERSION/APP_COMMIT remain the fallback).
x-runtime-env: &runtime-env
  NODE_ENV: production
  APP_ENV: ${DEPLOY_ENV:-beta}
  APP_VERSION: ${ADMIN_API_APP_VERSION:-${APP_VERSION:?APP_VERSION is required}}
  APP_COMMIT: ${ADMIN_API_APP_COMMIT:-${APP_COMMIT:?APP_COMMIT is required}}

x-web-runtime-env: &web-runtime-env
  APP_ENV: ${DEPLOY_ENV:-beta}
  APP_VERSION: ${ADMIN_WEB_APP_VERSION:-${APP_VERSION:?APP_VERSION is required}}
  APP_COMMIT: ${ADMIN_WEB_APP_COMMIT:-${APP_COMMIT:?APP_COMMIT is required}}

services:
  redis:
    <<: *app-defaults
    mem_limit: 256m
    memswap_limit: 512m
    cpus: 0.5
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "100"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes: [redis-data:/data]
    networks: [app]

  migrate:
    <<: *app-defaults
    mem_limit: 1g
    memswap_limit: 1536m
    cpus: 1
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:?IMAGE_NAMESPACE is required}/iig-admin-api:${ADMIN_API_IMAGE_TAG:-${IMAGE_TAG:?IMAGE_TAG is required}}
    restart: "no"
    command: ["node", "scripts/run-migrations.js"]
    env_file: [.env.container]
    environment: *runtime-env
    extra_hosts: [host.docker.internal:host-gateway]
    networks: [app]

  admin-api:
    <<: *app-defaults
    mem_limit: 1g
    memswap_limit: 1536m
    cpus: 1
    logging:
      driver: journald
      options:
        tag: "iig-admin-{{.Name}}"
        labels: "com.docker.compose.project,com.docker.compose.service"
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:?IMAGE_NAMESPACE is required}/iig-admin-api:${ADMIN_API_IMAGE_TAG:-${IMAGE_TAG:?IMAGE_TAG is required}}
    env_file: [.env.container]
    environment:
      <<: *runtime-env
      ADMIN_API_PORT: 3001
    extra_hosts: [host.docker.internal:host-gateway]
    volumes:
      - ${MEDIA_ROOT:?MEDIA_ROOT is required}/public/cleaned-audio:/app/public/cleaned-audio
      - ${MEDIA_ROOT:?MEDIA_ROOT is required}/public/dialogues:/app/public/dialogues
      - ${MEDIA_ROOT:?MEDIA_ROOT is required}/public/question-bank-media:/app/public/question-bank-media
    ports: ["127.0.0.1:${API_PORT:-3211}:3001"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    networks: [app]

  admin-web:
    <<: *app-defaults
    mem_limit: 128m
    memswap_limit: 256m
    cpus: 0.5
    environment: *web-runtime-env
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:?IMAGE_NAMESPACE is required}/iig-admin-admin-web:${ADMIN_WEB_IMAGE_TAG:-${IMAGE_TAG:?IMAGE_TAG is required}}
    depends_on:
      admin-api: { condition: service_healthy }
    volumes: ["${MEDIA_ROOT:?MEDIA_ROOT is required}/public:/srv/media:ro"]
    ports: ["127.0.0.1:${ADMIN_PORT:-3212}:8080"]
    networks: [app]

  exam-web:
    <<: *app-defaults
    mem_limit: 128m
    memswap_limit: 256m
    cpus: 0.5
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:?IMAGE_NAMESPACE is required}/iig-admin-exam-web:${EXAM_WEB_IMAGE_TAG:-${IMAGE_TAG:?IMAGE_TAG is required}}
    depends_on:
      admin-api: { condition: service_healthy }
    volumes: ["${MEDIA_ROOT:?MEDIA_ROOT is required}/public:/srv/media:ro"]
    ports: ["127.0.0.1:${EXAM_PORT:-3213}:8080"]
    networks: [app]

networks:
  app:
    name: iig-admin-${DEPLOY_ENV:-beta}
    external: true

volumes:
  redis-data:
    name: iig-admin-${DEPLOY_ENV:-beta}-redis-data
