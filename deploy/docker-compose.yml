name: iig-admin-${DEPLOY_ENV:-beta}

x-app-defaults: &app-defaults
  restart: unless-stopped
  init: true
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

x-runtime-env: &runtime-env
  NODE_ENV: production
  APP_ENV: ${DEPLOY_ENV:-beta}
  APP_VERSION: ${APP_VERSION:?APP_VERSION is required}
  APP_COMMIT: ${APP_COMMIT:?APP_COMMIT is required}

services:
  redis:
    <<: *app-defaults
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "100"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes: [redis-data:/data]
    networks: [app]

  migrate:
    <<: *app-defaults
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:?IMAGE_NAMESPACE is required}/iig-admin-api:${ADMIN_API_IMAGE_TAG:-${IMAGE_TAG:?IMAGE_TAG is required}}
    restart: "no"
    command: ["node", "scripts/run-migrations.js"]
    env_file: [.env.container]
    environment: *runtime-env
    extra_hosts: [host.docker.internal:host-gateway]
    networks: [app]

  admin-api:
    <<: *app-defaults
    logging:
      driver: journald
      options:
        tag: "iig-admin-{{.Name}}"
        labels: "com.docker.compose.project,com.docker.compose.service"
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:?IMAGE_NAMESPACE is required}/iig-admin-api:${ADMIN_API_IMAGE_TAG:-${IMAGE_TAG:?IMAGE_TAG is required}}
    env_file: [.env.container]
    environment:
      <<: *runtime-env
      ADMIN_API_PORT: 3001
    extra_hosts: [host.docker.internal:host-gateway]
    volumes:
      - ${MEDIA_ROOT:?MEDIA_ROOT is required}/public/cleaned-audio:/app/public/cleaned-audio
      - ${MEDIA_ROOT:?MEDIA_ROOT is required}/public/local_audio:/app/public/local_audio
      - ${MEDIA_ROOT:?MEDIA_ROOT is required}/public/local_voices:/app/public/local_voices
      - ${MEDIA_ROOT:?MEDIA_ROOT is required}/public/tmp_local:/app/public/tmp_local
      - ${MEDIA_ROOT:?MEDIA_ROOT is required}/public/dialogues:/app/public/dialogues
      - ${MEDIA_ROOT:?MEDIA_ROOT is required}/public/custom_voices:/app/public/custom_voices
      - ${MEDIA_ROOT:?MEDIA_ROOT is required}/public/question-bank-media:/app/public/question-bank-media
      - ${MODEL_ROOT:?MODEL_ROOT is required}/tts_env:/app/tts_env:ro
      - ${MODEL_ROOT:?MODEL_ROOT is required}/voice_clone_env:/app/voice_clone_env:ro
      - ${MODEL_ROOT:?MODEL_ROOT is required}/voice_clone_models:/app/voice_clone_models:ro
      - ${MODEL_ROOT:?MODEL_ROOT is required}/src/models:/app/src/models:ro
    ports: ["127.0.0.1:${API_PORT:-3211}:3001"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    networks: [app]

  scoring-api:
    <<: *app-defaults
    logging:
      driver: journald
      options:
        tag: "iig-admin-{{.Name}}"
        labels: "com.docker.compose.project,com.docker.compose.service"
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:?IMAGE_NAMESPACE is required}/iig-ai-scoring-api:${SCORING_API_IMAGE_TAG:-${IMAGE_TAG:?IMAGE_TAG is required}}
    env_file: [.env.container]
    environment:
      <<: *runtime-env
      AI_SCORING_API_PORT: 3002
    extra_hosts: [host.docker.internal:host-gateway]
    ports: ["127.0.0.1:${SCORING_API_PORT:-3214}:3002"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    networks: [app]

  scoring-worker:
    <<: *app-defaults
    logging:
      driver: journald
      options:
        tag: "iig-admin-{{.Name}}"
        labels: "com.docker.compose.project,com.docker.compose.service"
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:?IMAGE_NAMESPACE is required}/iig-ai-scoring-worker:${SCORING_WORKER_IMAGE_TAG:-${IMAGE_TAG:?IMAGE_TAG is required}}
    env_file: [.env.container]
    environment:
      <<: *runtime-env
      AI_SCORING_WORKER_HEALTH_PORT: 3003
    extra_hosts: [host.docker.internal:host-gateway]
    volumes:
      - ${MEDIA_ROOT:?MEDIA_ROOT is required}/public/cleaned-audio:/app/public/cleaned-audio
      - ${MEDIA_ROOT:?MEDIA_ROOT is required}/public/tmp_local:/app/public/tmp_local
      - ${MEDIA_ROOT:?MEDIA_ROOT is required}/public/question-bank-media:/app/public/question-bank-media
      - ${MODEL_ROOT:?MODEL_ROOT is required}/src/models:/app/src/models:ro
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    networks: [app]

  admin-web:
    <<: *app-defaults
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:?IMAGE_NAMESPACE is required}/iig-admin-admin-web:${ADMIN_WEB_IMAGE_TAG:-${IMAGE_TAG:?IMAGE_TAG is required}}
    depends_on:
      admin-api: { condition: service_healthy }
      scoring-api: { condition: service_healthy }
    volumes: ["${MEDIA_ROOT:?MEDIA_ROOT is required}/public:/srv/media:ro"]
    ports: ["127.0.0.1:${ADMIN_PORT:-3212}:8080"]
    networks: [app]

  exam-web:
    <<: *app-defaults
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:?IMAGE_NAMESPACE is required}/iig-admin-exam-web:${EXAM_WEB_IMAGE_TAG:-${IMAGE_TAG:?IMAGE_TAG is required}}
    depends_on:
      admin-api: { condition: service_healthy }
      scoring-api: { condition: service_healthy }
    volumes: ["${MEDIA_ROOT:?MEDIA_ROOT is required}/public:/srv/media:ro"]
    ports: ["127.0.0.1:${EXAM_PORT:-3213}:8080"]
    networks: [app]

networks:
  app:
    name: iig-admin-${DEPLOY_ENV:-beta}
    external: true

volumes:
  redis-data:
    name: iig-admin-${DEPLOY_ENV:-beta}-redis-data
