# Install in /etc/nginx/conf.d/iig-api-log-format.conf. The format deliberately
# excludes query strings, cookies and authorization headers.
log_format iig_api_json escape=json '{'
  '"timestamp":"$time_iso8601",'
  '"level":"info",'
  '"event":"nginx_api_access",'
  '"service":"iig-edge-nginx",'
  '"requestId":"$upstream_http_x_request_id",'
  '"nginxRequestId":"$request_id",'
  '"host":"$host",'
  '"clientIp":"$remote_addr",'
  '"forwardedFor":"$proxy_add_x_forwarded_for",'
  '"method":"$request_method",'
  '"path":"$uri",'
  '"protocol":"$server_protocol",'
  '"statusCode":$status,'
  '"responseBytes":$body_bytes_sent,'
  '"requestTimeSeconds":$request_time,'
  '"upstreamAddress":"$upstream_addr",'
  '"upstreamStatus":"$upstream_status",'
  '"upstreamConnectTimeSeconds":"$upstream_connect_time",'
  '"upstreamHeaderTimeSeconds":"$upstream_header_time",'
  '"upstreamResponseTimeSeconds":"$upstream_response_time",'
  '"userAgent":"$http_user_agent"'
'}';
