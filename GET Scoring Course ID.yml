    - data:
        code: "import json\n\ndef main(http_response_body: str) -> dict:\n    data\
          \ = json.loads(http_response_body)\n    root_data = data[0] if isinstance(data,\
          \ list) else data\n    sections = root_data.get(\"mckTestResponse\", [])\n\
          \    \n    items = []\n    \n    for sec in sections:\n        sec_name\
          \ = sec.get(\"name\") # \"Speaking\" hoặc \"Writing\"\n        questionnaires\
          \ = sec.get(\"questionnaires\", [])\n        \n        for qnaire in questionnaires:\n\
          \            left_sections = qnaire.get(\"leftSections\", [])\n        \
          \    left_section = left_sections[0] if left_sections else {}\n        \
          \    prompt_html = left_section.get(\"textContent\", \"\")\n           \
          \ left_audio_id = left_section.get(\"audioFileId\", \"\")\n            \n\
          \            questions = qnaire.get(\"questions\", [])\n            for\
          \ q in questions:\n                q_no = q.get(\"no\")\n              \
          \  q_id = q.get(\"questionId\")\n                choose_id = q.get(\"chooseId\"\
          )\n                \n                # Tạo bản ghi phẳng đại diện cho từng\
          \ câu hỏi\n                item = {\n                    \"sec_name\": sec_name,\n\
          \                    \"q_no\": q_no,\n                    \"q_id\": q_id,\n\
          \                    \"choose_id\": choose_id,\n                    \"prompt_html\"\
          : prompt_html,\n                    \"left_audio_id\": left_audio_id,\n\
          \                }\n                \n                if sec_name == \"\
          Speaking\":\n                    item[\"recording_file_id\"] = q.get(\"\
          recordingFileId\")\n                else: # Writing\n                  \
          \  item[\"writing_answer\"] = q.get(\"writingAnswer\", \"\")\n         \
          \           \n                items.append(item)\n                \n   \
          \ return {\n        \"questions_array\": items # Trả về mảng 19 items để\
          \ đưa vào Node Iteration tiếp theo\n    }"
