    - data:
        code: "import re\nimport json\n\ndef clean_html(html):\n    if not html: return\
          \ \"\"\n    cleanr = re.compile('<.*?>')\n    return re.sub(cleanr, '',\
          \ html).replace('&nbsp;', ' ').strip()\n\n# Đưa thẳng các biến String từ\
          \ Node 4.0 vào hàm main\ndef main(sec_name: str, q_no: str, prompt_html:\
          \ str, recording_file_id: str, left_audio_id: str, writing_answer: str,\
          \ detail_response_str: str = \"\") -> dict:\n    \n    student_audio_id\
          \ = recording_file_id\n    current_left_audio = left_audio_id\n    current_prompt_html\
          \ = prompt_html\n    \n    question_text = \"\"\n    question_audio_id =\
          \ \"\"\n    \n    # Nếu có dữ liệu detail (Speaking Q5-10) từ HTTP Request\n\
          \    if detail_response_str:\n        try:\n            detail = json.loads(detail_response_str)\n\
          \            left_sections = detail.get(\"leftSections\", [])\n        \
          \    if left_sections:\n                current_prompt_html = left_sections[0].get(\"\
          textContent\", current_prompt_html)\n                current_left_audio\
          \ = left_sections[0].get(\"audioFileId\", current_left_audio)\n        \
          \        \n            question_info = detail.get(\"questionInfo\", {})\n\
          \            if question_info:\n                question_text = question_info.get(\"\
          questionName\", \"\")\n                question_audio_id = question_info.get(\"\
          audioFileId\", \"\")\n                student_audio_id = question_info.get(\"\
          recordingFileId\", student_audio_id)\n        except:\n            pass\n\
          \n    # 1. Trích xuất link ảnh\n    img_urls = re.findall(r'<img[^>]+src=\"\
          ([^\">]+)\"', current_prompt_html)\n    image_url = img_urls[0] if img_urls\
          \ else \"\"\n    \n    # 2. Làm sạch text\n    prompt_text = clean_html(current_prompt_html)\n\
          \    \n    # 3. Trích xuất từ khóa (Writing Q1-5)\n    keywords = \"\"\n\
          \    try:\n        q_no_int = int(q_no)\n    except:\n        q_no_int =\
          \ 0\n        \n    if sec_name == \"Writing\" and q_no_int in [1, 2, 3,\
          \ 4, 5]:\n        kw_match = re.search(r'<h4[^>]*>(.*?)<\\/h4>', current_prompt_html,\
          \ re.IGNORECASE)\n        if kw_match:\n            keywords = clean_html(kw_match.group(1))\n\
          \n    # Trả về payload sạch sẽ chuẩn bị gửi đi đổi link S3 và chấm điểm\n\
          \    return {\n        \"sec_name\": sec_name,\n        \"q_no\": q_no,\n\
          \        \"prompt_text\": prompt_text,\n        \"image_url\": image_url,\n\
          \        \"keywords\": keywords,\n        \"question_text\": question_text,\n\
          \        \"left_audio_id\": current_left_audio,\n        \"question_audio_id\"\
          : question_audio_id,\n        \"student_audio_id\": student_audio_id,\n\
          \        \"writing_answer\": writing_answer\n    }"
