    - data:
        code: "import json\n\ndef main(sec_name: str, q_no: str, prompt_text: str,\
          \ image_url: str, \n         keywords: str, question_text: str, writing_answer:\
          \ str,\n         resolved_left_audio: str, resolved_question_audio: str,\
          \ resolved_student_audio: str) -> dict:\n    \n    try:\n        q_no_int\
          \ = int(q_no)\n    except:\n        q_no_int = 0\n\n    # 1. Logic tạo mã\
          \ vị trí điểm (s_q1, w_q1...)\n    prefix = \"s\" if sec_name == \"Speaking\"\
          \ else \"w\"\n    vi_tri_diem = f\"{prefix}_q{q_no}\"\n\n    # 2. Logic\
          \ tạo nhóm điểm (rubric_group)\n    rubric_group = \"\"\n    if sec_name\
          \ == \"Speaking\":\n        if q_no_int in [1, 2]:\n            rubric_group\
          \ = \"Read Text Aloud\"\n        elif q_no_int in [3, 4]:\n            rubric_group\
          \ = \"Describe a picture\"\n        elif q_no_int in [5, 6, 7]:\n      \
          \      rubric_group = \"Respond to questions (Q5-7)\"\n        elif q_no_int\
          \ in [8, 9, 10]:\n            rubric_group = \"Respond to questions (Q8-10)\"\
          \n        elif q_no_int == 11:\n            rubric_group = \"Express an\
          \ opinion\"\n    elif sec_name == \"Writing\":\n        if q_no_int in [1,\
          \ 2, 3, 4, 5]:\n            rubric_group = \"Write a Sentence Based on a\
          \ Picture\"\n        elif q_no_int in [6, 7]:\n            rubric_group\
          \ = \"Respond to a Written Request / Email\"\n        elif q_no_int == 8:\n\
          \            rubric_group = \"Write an opinion essay\"\n\n    # 3. Gom data\
          \ vào dict để xuất ra chuỗi JSON debug\n    debug_payload = {\n        \"\
          sec_name\": sec_name,\n        \"q_no\": q_no,\n        \"vi_tri_diem\"\
          : vi_tri_diem,\n        \"rubric_group\": rubric_group,\n        \"prompt_text\"\
          : prompt_text,\n        \"image_url\": image_url,\n        \"keywords\"\
          : keywords,\n        \"question_text\": question_text,\n        \"writing_answer\"\
          : writing_answer,\n        \"left_audio_url\": resolved_left_audio,\n  \
          \      \"question_audio_url\": resolved_question_audio,\n        \"student_audio_url\"\
          : resolved_student_audio\n    }\n    \n    debug_json_str = json.dumps(debug_payload,\
          \ ensure_ascii=False)\n\n    # 4. Trả về từng biến phẳng VÀ thêm cục biến\
          \ JSON debug\n    return {\n        \"sec_name\": sec_name,\n        \"\
          q_no\": q_no,\n        \"vi_tri_diem\": vi_tri_diem,\n        \"rubric_group\"\
          : rubric_group,\n        \"prompt_text\": prompt_text,\n        \"image_url\"\
          : image_url,\n        \"keywords\": keywords,\n        \"question_text\"\
          : question_text,\n        \"writing_answer\": writing_answer,\n        \"\
          left_audio_url\": resolved_left_audio,\n        \"question_audio_url\":\
          \ resolved_question_audio,\n        \"student_audio_url\": resolved_student_audio,\n\
          \        \"debug_json\": debug_json_str\n    }"
