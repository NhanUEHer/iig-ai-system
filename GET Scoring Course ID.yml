    - data:
        code: "import urllib.request\nimport json\nimport ssl\n\ndef get_signed_url(file_id:\
          \ str, access_token: str) -> str:\n    # 1. Bỏ qua nếu không có ID\n   \
          \ if not file_id or str(file_id).strip() in [\"\", \"None\", \"null\"]:\n\
          \        return \"\"\n    \n    # 2. Xử lý token\n    clean_token = str(access_token).replace(\"\
          Bearer \", \"\").strip()\n    url = f\"https://elearningapi.iigvietnam.com/api-admin-old/api/FileUploader/get-info-migrate-file/{file_id}?access_token={clean_token}\"\
          \n    \n    headers = {\n        \"Authorization\": f\"Bearer {clean_token}\"\
          ,\n        \"Category\": \"admin\",\n        \"Domain\": \"iig\"\n    }\n\
          \    \n    # 3. Bypass SSL để không bị Dify Sandbox chặn\n    ctx = ssl.create_default_context()\n\
          \    ctx.check_hostname = False\n    ctx.verify_mode = ssl.CERT_NONE\n \
          \   \n    try:\n        req = urllib.request.Request(url, headers=headers)\n\
          \        with urllib.request.urlopen(req, timeout=10, context=ctx) as response:\n\
          \            res_data = json.loads(response.read().decode('utf-8'))\n  \
          \          \n            # 4. Lấy đúng link từ key 'tempUrl'\n         \
          \   return str(res_data.get(\"tempUrl\", \"\"))\n            \n    except\
          \ Exception as e:\n        # Trả về rỗng nếu có lỗi bất ngờ\n        return\
          \ \"\"\n\ndef main(left_audio_id: str, question_audio_id: str, student_audio_id:\
          \ str, access_token: str) -> dict:\n    return {\n        \"resolved_left_audio\"\
          : get_signed_url(left_audio_id, access_token),\n        \"resolved_question_audio\"\
          : get_signed_url(question_audio_id, access_token),\n        \"resolved_student_audio\"\
          : get_signed_url(student_audio_id, access_token)\n    }"
