    - data:
        code: |
          import json
          SCORE_KEYS=["pronunciation_score","intonation_fluency_score","grammar_score","vocabulary_score","cohesion_score","relevance_score","completeness_score"]
          def integer(value,label,low=0,high=5):
              if value is None or value=="": raise ValueError(label+" is required")
              try: parsed=int(value)
              except Exception: raise ValueError(label+" must be an integer")
              if parsed<low or parsed>high: raise ValueError(label+" is outside the accepted range")
              return parsed
          def as_bool(value):
