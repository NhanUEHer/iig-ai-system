    - data:
        code: |
          def main(schema_version,job_id,keycode,question_id,question_number,group_code,scorer_type,response_profile,ai_status,upstream_zero_reason,question,transcript)->dict:
              import json
              errors=[]; reason=(upstream_zero_reason or "NONE").strip().upper()
              if schema_version!="express-opinion-question-input-v1": errors.append("invalid schema_version")
              if not (job_id or "").strip() or not (keycode or "").strip(): errors.append("job_id and keycode are required")
              if question_id!="s_q11" or int(question_number)!=11: errors.append("question identity mismatch")
              if group_code!="EXPRESS_AN_OPINION" or scorer_type!="EXPRESS_AN_OPINION": errors.append("scorer identity mismatch")
              if response_profile!="EXTENDED_OPINION": errors.append("response_profile mismatch")
              if not (question or "").strip(): errors.append("question is required")
              if reason not in {"NONE","NO_SPEECH","WRONG_LANGUAGE_VI","WRONG_LANGUAGE_OTHER"}: errors.append("invalid zero reason")
              if reason!="NONE": route="UPSTREAM_ZERO" if ai_status=="ZERO_SCORE" else "INVALID"
              else: route="NORMAL" if ai_status=="READY_FOR_AI" and (transcript or "").strip() else "INVALID"
              if errors: route="INVALID"
              return {"route":route,"validation_ok":route!="INVALID","validation_errors_json":json.dumps(errors,ensure_ascii=False),"normalized_zero_reason":reason}
        code_language: python3
        outputs:
