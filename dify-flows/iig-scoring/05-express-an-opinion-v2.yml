                  if not isinstance(item,dict): continue
                  kind=str(item.get("error_type") or "").upper(); severity=str(item.get("severity") or "MEDIUM").upper()
                  if kind not in ALLOWED: continue
                  if severity not in RANK: severity="MEDIUM"
                  evidence=item.get("evidence") if isinstance(item.get("evidence"),list) else [item.get("evidence")]
                  evidence=list(dict.fromkeys([" ".join(str(x or "").split()) for x in evidence if str(x or "").strip()]))
                  if not evidence: continue
                  current=grouped.get(kind,{"error_type":kind,"severity":severity,"count":0,"evidence":[],"message_vi":""})
                  if RANK[severity]>RANK[current["severity"]]: current["severity"]=severity
                  current["evidence"]=list(dict.fromkeys(current["evidence"]+evidence))[:99]; current["count"]=len(current["evidence"])
                  message=" ".join(str(item.get("message_vi") or "").split())
