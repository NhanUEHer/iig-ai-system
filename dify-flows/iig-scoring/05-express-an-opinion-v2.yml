                      errors=[{"error_type":"TASK_RELEVANCE","severity":"MEDIUM","count":1,"evidence":["prompt_alignment_ratio="+str(signals.get("prompt_alignment_ratio"))],"message_vi":"Một phần nội dung chưa tập trung trực tiếp vào yêu cầu của câu hỏi."}]
                  elif signals.get("excessive_fillers"):
