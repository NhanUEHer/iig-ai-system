    - data:
        code: |-
          import math

          def main(pronunciation_score, intonation_score, grammar_score, vocabulary_score, cohesion_score, relevance_score, completeness_score) -> dict:
              pronunciation = int(pronunciation_score)
              intonation = int(intonation_score)
              grammar = int(grammar_score)
              vocabulary = int(vocabulary_score)
              cohesion = int(cohesion_score)
              relevance = int(relevance_score)
              completeness = int(completeness_score)

              scores = [pronunciation, intonation, grammar, vocabulary, cohesion, relevance, completeness]
              if any(score not in (0, 1, 2, 3) for score in scores):
                  raise ValueError("Component scores must be integers from 0 to 3")

              average = sum(scores) / 7
              final_score = math.floor(average + 0.5)

              return {
                  "pronunciation_score": pronunciation,
                  "intonation_score": intonation,
                  "grammar_score": grammar,
                  "vocabulary_score": vocabulary,
                  "cohesion_score": cohesion,
                  "relevance_score": relevance,
                  "completeness_score": completeness,
                  "final_score": final_score,
              }
        code_language: python3
