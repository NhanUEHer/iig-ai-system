              try: number=float(value)
              except (TypeError,ValueError): raise ValueError(f'{key} must be an integer, got {value!r}')
              if not number.is_integer(): raise ValueError(f'{key} must be an integer, got {value!r}')
              return int(number)
          def safe_int(value,default=0):
              try:
                  if value is None or str(value).strip()=='': return default
                  return int(float(value))
              except (TypeError,ValueError): return default
          def safe_float(value,default=0.0):
              try:
                  if value is None or str(value).strip()=='': return default
                  return float(value)
              except (TypeError,ValueError): return default
          def main(job_id,question_id,score_output,deterministic_signals_json):
