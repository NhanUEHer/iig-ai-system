              raw=round(sum(s.values())/4.0,4); data={'component_scores':{k[:-6]:v for k,v in s.items()},'question_score_raw':raw,'question_score_rounded':final,'zero_reason':reason,'rule_signals':sig,'applied_rules':list(dict.fromkeys(rules))}; event={'schema_version':'writing-progress-event-v1','event_type':'SCORE_READY','job_id':job_id,'question_id':question_id,'sequence':1,'data':data}
