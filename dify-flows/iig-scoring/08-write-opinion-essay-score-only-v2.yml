              for k in ['clear_stance','has_introduction','has_conclusion','single_block','dialogue_or_email_format','completely_off_topic','non_english','gibberish','copied_prompt_only','no_original_content','has_fragment','has_comma_splice','cut_off','lacks_sentence_variety','vocabulary_range_limited','organization_weak','informal_register']: sig[k]=b(r.get(k,False))
              reason=None; words=max(0,safe_int(sig.get('response_word_count'),0))
              if sig['gibberish']: reason='GIBBERISH_RESPONSE'
              elif sig['non_english']: reason='NON_ENGLISH_RESPONSE'
              elif sig['copied_prompt_only']: reason='COPIED_PROMPT'
              elif sig['no_original_content']: reason='NO_ORIGINAL_CONTENT'
              elif sig['completely_off_topic'] and sig['topic_alignment_ratio']<0.5: reason='COMPLETELY_OFF_TOPIC'
              if reason: s={k:0 for k in KEYS}; final=0; rules=['BUSINESS_ZERO_'+reason]
              else:
                  s={k:max(1,v) for k,v in s.items()}; cap=5
                  if words<100: cap=1; rules.append('UNDER_100_WORDS_CAP')
                  elif words<200: cap=2; rules.append('UNDER_200_WORDS_CAP')
                  elif words<250: cap=3; rules.append('UNDER_250_WORDS_CAP')
                  elif words<300: cap=4; rules.append('UNDER_300_WORDS_CAP')
                  if not sig['clear_stance'] or sig['reason_count']==0: s['opinion_support_score']=min(s['opinion_support_score'],2); rules.append('STANCE_OR_SUPPORT_CAP')
                  if sig['example_count']==0: s['opinion_support_score']=min(s['opinion_support_score'],3); rules.append('NO_EXAMPLE_CAP')
                  if sig['has_fragment']: s['grammar_score']=min(s['grammar_score'],1); rules.append('FRAGMENT_CAP')
                  elif sig['has_comma_splice']: s['grammar_score']=min(s['grammar_score'],2); rules.append('COMMA_SPLICE_CAP')
                  if sig['cut_off']: s['grammar_score']=min(s['grammar_score'],2); rules.append('CUT_OFF_CAP')
                  if sig['lacks_sentence_variety']: s['grammar_score']=min(s['grammar_score'],3); rules.append('SENTENCE_VARIETY_CAP')
                  if sig['spelling_error_count']>5 or sig.get('all_caps'): s['vocabulary_score']=min(s['vocabulary_score'],2); rules.append('VOCABULARY_MECHANICS_CAP')
                  elif sig['spelling_error_count']>=3: s['vocabulary_score']=min(s['vocabulary_score'],3); rules.append('SPELLING_CAP')
                  if sig['vocabulary_range_limited']: s['vocabulary_score']=min(s['vocabulary_score'],3); rules.append('VOCABULARY_RANGE_CAP')
                  if sig['informal_register'] or safe_int(sig.get('contraction_count'),0)>=3: s['vocabulary_score']=min(s['vocabulary_score'],3); rules.append('FORMAL_STYLE_CAP')
                  if sig['dialogue_or_email_format']: s['organization_score']=min(s['organization_score'],1); rules.append('WRONG_FORMAT_CAP')
