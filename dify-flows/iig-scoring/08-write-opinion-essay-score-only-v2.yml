ption":"True when there is not enough English to assess."},"gibberish":{"type":"boolean","description":"True when the response is random or nonsensical."},"copied_prompt_only":{"type":"boolean","description":"True when the candidate only copies the prompt without an original proposition."},"no_original_content":{"type":"boolean","description":"True when the response lacks assessable independent content."},"has_fragment":{"type":"boolean","description":"True when concrete sentence fragments are present."},"has_comma_splice":{"type":"boolean","description":"True when independent clauses are joined only by commas."},"cut_off":{"type":"boolean","description":"True when the response ends abruptly."},"lacks_sentence_variety":{"type":"boolean","description":"True when sentence structures are substantially repetitive."},"vocabulary_range_limited":{"type":"boolean","description":"True when vocabulary range is clearly too basic or repetitive for the essay."},"organization_weak":{"type":"boolean","description":"True when progression or cohesion is materially weak."},"informal_register":{"type":"boolean","description":"True when the tone is materially too casual for a formal essay."},"spelling_error_count":{"type":"integer","description":"Number of concrete spelling errors."}},"required":["analysis_rationale","opinion_support_score","grammar_score","vocabulary_score","organization_score","topic_alignment_ratio","clear_stance","reason_count","example_count","body_paragraph_count","has_introduction","has_conclusion","single_block","dialogue_or_email_format","completely_off_topic","non_english","gibberish","copied_prompt_only","no_original_content","has_fragment","has_comma_splice","cut_off","lacks_sentence_variety","vocabulary_range_limited","organization_weak","informal_register","spelling_error_count"]}'
