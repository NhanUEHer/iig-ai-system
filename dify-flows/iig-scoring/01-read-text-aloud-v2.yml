    - data:
        code: |-
          import json
          import re

          def one_sentence(value, fallback):
              text = " ".join(str(value or "").split()).strip()
              if not text:
                  text = fallback
              chunks = [part.strip() for part in re.split(r"(?<=[.!?])\s+", text) if part.strip()]
              text = chunks[0] if chunks else fallback
              if text[-1:] not in ".!?":
                  text += "."
              return text[:360]

          def main(job_id, keycode, question_id, group_code,
                   pronunciation_score, intonation_stress_score,
                   question_score_raw, question_score_rounded,
                   completion_ratio,
                   rule_signals_json, score_event_json, errors_json,
                   errors_event_json, comment_output) -> dict:
              output = comment_output if isinstance(comment_output, dict) else {}
              strength = one_sentence(output.get("strength"), "Bạn đã hoàn thành phần đọc và tạo được dữ liệu để đánh giá.")
              improvement = one_sentence(output.get("improvement"), "Bạn cần cải thiện độ rõ của phát âm và nhịp đọc.")
              action = one_sentence(output.get("action"), "Hãy luyện đọc chậm theo cụm nghĩa và ghi âm lại để tự kiểm tra.")
              comment = {
                  "strength": strength,
                  "improvement": improvement,
                  "action": action,
                  "text": " ".join([strength, improvement, action]),
              }
              try:
                  errors = json.loads(errors_json or "[]")
              except Exception:
                  errors = []
              if not errors:
                  if int(pronunciation_score) >= 3 and int(intonation_stress_score) >= 3 and float(completion_ratio) >= 0.98:
                      strength = "Bạn phát âm rõ ràng, hoàn thành đầy đủ đoạn văn và duy trì ngữ điệu, trọng âm phù hợp."
                      improvement = "Bài đọc chưa có lỗi nổi bật cần ưu tiên khắc phục ở lần này."
                      action = "Hãy tiếp tục duy trì tốc độ, cách ngắt cụm và độ rõ hiện tại trong những bài tiếp theo."
                  else:
                      strength = "Phần bài đọc đã thực hiện nhìn chung vẫn có thể theo dõi được."
                      improvement = "Chưa có một lỗi riêng lẻ nổi bật, nhưng độ ổn định của phần thể hiện vẫn có thể được cải thiện."
                      action = "Hãy tiếp tục luyện đọc theo cụm nghĩa và nghe lại bản ghi để tăng độ ổn định."
                  comment = {
                      "strength": strength,
                      "improvement": improvement,
                      "action": action,
                      "text": " ".join([strength, improvement, action]),
                  }
              else:
                  primary = errors[0] if isinstance(errors[0], dict) else {}
                  primary_type = str(primary.get("error_type", ""))
                  evidence = " ".join(str(primary.get("evidence", "")).split())[:100]
                  source_message = " ".join(str(primary.get("message_vi", "")).split()).strip(" .")
                  learner_message = source_message.replace("Thí sinh", "Bạn").replace("thí sinh", "bạn")
                  improvement_templates = {
                      "PRONUNCIATION": f'Bạn cần ưu tiên cải thiện phát âm ở “{evidence}”.',
                      "TEXT_ACCURACY": learner_message + "." if learner_message else "Bạn cần ưu tiên cải thiện độ chính xác của nội dung đọc.",
                      "PAUSING": f'Bạn cần điều chỉnh cách ngắt nghỉ ở “{evidence}” để câu đọc tự nhiên hơn.',
                      "INTONATION_STRESS": f'Bạn cần thể hiện ngữ điệu và trọng âm rõ hơn ở “{evidence}”.',
                      "FLUENCY": learner_message + "." if learner_message else "Bạn cần giảm lặp từ và ngập ngừng để bài đọc trôi chảy hơn.",
                      "TASK_COMPLETION": "Bạn chưa hoàn thành đầy đủ đoạn văn trong thời gian của bài đọc.",
                  }
                  action_templates = {
                      "PRONUNCIATION": f'Hãy nghe mẫu, tách âm và luyện lặp lại cụm “{evidence}” trước khi đọc lại toàn câu.',
                      "TEXT_ACCURACY": f'Hãy đánh dấu cụm “{evidence}” trong bài chuẩn và luyện đọc đối chiếu để tránh bỏ hoặc thay sai từ.',
                      "PAUSING": "Hãy chia câu theo cụm nghĩa, đánh dấu vị trí ngắt và luyện đọc liền mạch từng cụm.",
                      "INTONATION_STRESS": "Hãy gạch chân từ khóa, nhấn rõ trọng âm và mô phỏng lại đường lên xuống giọng của câu mẫu.",
                      "FLUENCY": f'Hãy luyện đọc cụm “{evidence}” chậm và liền mạch trước khi tăng dần tốc độ.',
                      "TASK_COMPLETION": "Hãy bấm giờ khi luyện tập và điều chỉnh tốc độ để đọc hết đoạn văn mà vẫn giữ độ rõ.",
                  }
                  improvement = one_sentence(improvement_templates.get(primary_type), improvement)
                  action = one_sentence(action_templates.get(primary_type), action)
                  comment["improvement"] = improvement
                  comment["action"] = action
                  comment["text"] = " ".join([strength, improvement, action])
              incomplete = float(completion_ratio) < 0.98 or any(
                  item.get("error_type") == "TASK_COMPLETION" for item in errors if isinstance(item, dict)
              )
              forbidden_completion_claims = (
                  "hoàn thành toàn bộ", "hoàn thành bài đọc", "đọc hết", "đọc toàn bộ", "hoàn thành đoạn văn"
              )
              if incomplete and any(phrase in strength.lower() for phrase in forbidden_completion_claims):
                  if float(completion_ratio) >= 0.8:
                      strength = "Bạn đã đọc được phần lớn đoạn văn và phần đã thể hiện nhìn chung vẫn có thể theo dõi được."
                  else:
                      strength = "Bạn đã thực hiện được một phần bài đọc và tạo đủ nội dung để xác định điểm cần cải thiện."
                  comment["strength"] = strength
                  comment["text"] = " ".join([strength, improvement, action])
              try:
                  rule_signals = json.loads(rule_signals_json or "{}")
              except Exception:
                  rule_signals = {}
              result = {
                  "schema_version": "rta-question-result-v1",
                  "job_id": job_id,
                  "keycode": keycode,
                  "question_id": question_id,
                  "group_code": group_code,
                  "status": "COMPLETED",
                  "pronunciation_score": int(pronunciation_score),
                  "intonation_stress_score": int(intonation_stress_score),
                  "question_score_raw": float(question_score_raw),
                  "question_score_rounded": int(question_score_rounded),
                  "zero_reason": None,
                  "rule_signals": rule_signals,
                  "errors": errors,
                  "comment": comment,
                  "versions": {
                      "rubric_version": "rta-q1-q2-rubric-v2",
                      "score_prompt_version": "rta-score-v3",
                      "error_prompt_version": "rta-error-v10",
                      "comment_prompt_version": "rta-comment-v7",
                  },
              }
              envelope = lambda event_type, sequence, data: json.dumps({
                  "schema_version": "rta-progress-event-v1",
                  "event_type": event_type,
                  "job_id": job_id,
                  "question_id": question_id,
                  "sequence": sequence,
                  "data": data,
              }, ensure_ascii=False)
              return {
                  "pronunciation_score": int(pronunciation_score),
                  "intonation_stress_score": int(intonation_stress_score),
                  "question_score_raw": float(question_score_raw),
                  "question_score_rounded": int(question_score_rounded),
                  "zero_reason": "NONE",
                  "errors_json": json.dumps(errors, ensure_ascii=False),
                  "comment_strength": strength,
                  "comment_improvement": improvement,
                  "comment_action": action,
                  "comment_text": comment["text"],
                  "score_event_json": score_event_json,
                  "errors_event_json": errors_event_json,
                  "comment_event_json": envelope("COMMENT_READY", 3, comment),
                  "completed_event_json": envelope("QUESTION_COMPLETED", 4, result),
                  "result_json": json.dumps(result, ensure_ascii=False),
              }
        code_language: python3
        outputs:
          comment_action: {children: null, type: string}
          comment_event_json: {children: null, type: string}
          comment_improvement: {children: null, type: string}
          comment_strength: {children: null, type: string}
