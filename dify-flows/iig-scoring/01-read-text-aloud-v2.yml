    - data:
        context:
          enabled: false
          variable_selector: []
        model:
          completion_params:
            json_schema: '{"type":"object","additionalProperties":false,"properties":{"strength":{"type":"string"},"improvement":{"type":"string"},"action":{"type":"string"}},"required":["strength","improvement","action"]}'
            max_output_tokens: 1500
            temperature: 0.2
            thinking_budget: 0
            thinking_mode: false
          mode: chat
          name: gemini-3.8-flash
          provider: langgenius/gemini/google
        prompt_template:
        - id: rta-v2-comment-system
          role: system
          text: |-
            Write concise Vietnamese feedback for one TOEIC Speaking Read Text Aloud response.

            Return exactly three structured fields, each containing exactly one complete sentence:
            strength: one specific positive observation supported by the stronger component score and the actual amount completed.
            improvement: the single most important weakness supported by the highest-severity supplied error.
            action: one concrete practice action directly addressing that weakness for the next attempt.

            Use only the supplied scores, alignment/completion ratios, and normalized errors. Do not invent a word-level error, cause, or strength that is absent from those inputs. When errors is empty, acknowledge stable completion and recommend maintaining clarity, rhythm, or stress based on the lower component score.

            COMPLETION SAFETY
            - If completion_ratio is below 0.98 or TASK_COMPLETION is present, never say the candidate completed, finished, or read the entire passage.
            - If completion_ratio is 0.80 to 0.97, strength may acknowledge that most of the attempted portion remained understandable or that the candidate read most of the passage.
            - If completion_ratio is below 0.80, strength must neutrally acknowledge only the portion actually attempted.
            - When TASK_COMPLETION is HIGH, improvement must mention the incomplete ending unless another HIGH error is clearly more consequential.

            ERROR PRIORITY
            - Base improvement on the highest-severity error; for equal severity prioritize TASK_COMPLETION, TEXT_ACCURACY, PRONUNCIATION, FLUENCY, PAUSING, then INTONATION_STRESS.
            - Make action directly address that selected weakness and fit this particular response.

            Keep the total near three short sentences. Do not mention AI, model, rubric, JSON, internal error types, or unsupported details. Do not change or recalculate scores. Avoid generic praise such as "Bạn làm rất tốt" without a specific basis. Do not quote more than one short evidence word or phrase. If the score is low, strength may neutrally acknowledge the portion that was completed.
        - id: rta-v2-comment-user
          role: user
          text: |-
            question={{#rta-v2-start.question_id#}}
            pronunciation_score={{#rta-v2-normalize-score.pronunciation_score#}}
            intonation_stress_score={{#rta-v2-normalize-score.intonation_stress_score#}}
            question_score={{#rta-v2-normalize-score.question_score_rounded#}}
            alignment_ratio={{#rta-v2-normalize-score.alignment_ratio#}}
            completion_ratio={{#rta-v2-normalize-score.completion_ratio#}}
            error_summary={{#rta-v2-normalize-errors.error_summary#}}
            errors={{#rta-v2-normalize-errors.errors_json#}}

            Return the three Vietnamese feedback fields only.
