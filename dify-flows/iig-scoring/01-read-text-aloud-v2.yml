          required: true
          type: select
          variable: question_id
        - default: READ_TEXT_ALOUD
          hint: Fixed group for Q1-Q2.
          label: group_code
          options:
          - READ_TEXT_ALOUD
          placeholder: ''
          required: true
          type: select
          variable: group_code
        - default: READY_FOR_AI
          hint: Normal scoring requires READY_FOR_AI.
          label: ai_status
          options:
          - READY_FOR_AI
          - ZERO_SCORE
          placeholder: ''
          required: true
          type: select
          variable: ai_status
        - default: NONE
          hint: Set only when upstream already established a business zero.
          label: upstream_zero_reason
          options:
          - NONE
          - NO_SPEECH
          - WRONG_LANGUAGE_VI
          - WRONG_LANGUAGE_OTHER
          placeholder: ''
          required: true
          type: select
          variable: upstream_zero_reason
        - default: ''
          hint: Official passage shown to the candidate.
          label: text_passage
          options: []
          placeholder: ''
          required: true
          type: paragraph
          variable: text_passage
        - default: ''
          hint: Transcript already produced upstream; this flow never runs STT.
          label: transcript
          options: []
          placeholder: ''
          required: false
          type: paragraph
          variable: transcript
        - allowed_file_extensions: []
          allowed_file_types:
          - audio
          allowed_file_upload_methods:
          - local_file
          - remote_url
          default: ''
          hide: false
          hint: Canonical candidate audio; optional only for an upstream-zero run.
          label: student_audio
          options: []
          placeholder: ''
          required: false
          type: file
          variable: student_audio
      height: 450
      id: rta-v2-start
      position:
        x: 40
        y: 320
      positionAbsolute:
        x: 40
        y: 320
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 280
      zIndex: 0
    - data:
        code: |-
          def main(schema_version, job_id, keycode, question_id, group_code,
                   ai_status, upstream_zero_reason, text_passage, transcript) -> dict:
              errors = []
              reason = (upstream_zero_reason or "NONE").strip().upper()
              valid_reasons = {
                  "NONE", "NO_SPEECH", "WRONG_LANGUAGE_VI",
                  "WRONG_LANGUAGE_OTHER"
              }

              if schema_version != "rta-question-input-v1":
                  errors.append("schema_version must be rta-question-input-v1")
              if not (job_id or "").strip():
                  errors.append("job_id is required")
              if not (keycode or "").strip():
                  errors.append("keycode is required")
              if question_id not in {"s_q1", "s_q2"}:
                  errors.append("question_id must be s_q1 or s_q2")
              if group_code != "READ_TEXT_ALOUD":
                  errors.append("group_code must be READ_TEXT_ALOUD")
              if not (text_passage or "").strip():
                  errors.append("text_passage is required")
              if reason not in valid_reasons:
                  errors.append("invalid upstream_zero_reason")

              if errors:
                  route = "INVALID"
              elif reason != "NONE":
                  if ai_status != "ZERO_SCORE":
                      errors.append("upstream zero requires ai_status ZERO_SCORE")
                      route = "INVALID"
                  else:
                      route = "UPSTREAM_ZERO"
              else:
                  if ai_status != "READY_FOR_AI":
                      errors.append("normal scoring requires READY_FOR_AI")
                  if not (transcript or "").strip():
                      errors.append("transcript is required for normal scoring")
                  route = "NORMAL" if not errors else "INVALID"

              return {
                  "route": route,
                  "validation_ok": route != "INVALID",
                  "validation_errors_json": __import__("json").dumps(errors, ensure_ascii=False),
                  "normalized_zero_reason": reason,
              }
        code_language: python3
        outputs:
          normalized_zero_reason:
            children: null
            type: string
          route:
            children: null
            type: string
          validation_errors_json:
            children: null
            type: string
          validation_ok:
            children: null
            type: boolean
        selected: false
        title: Validate and Route Input
        type: code
        variables:
        - value_selector: [rta-v2-start, schema_version]
          value_type: string
          variable: schema_version
        - value_selector: [rta-v2-start, job_id]
          value_type: string
          variable: job_id
        - value_selector: [rta-v2-start, keycode]
          value_type: string
          variable: keycode
        - value_selector: [rta-v2-start, question_id]
          value_type: string
          variable: question_id
        - value_selector: [rta-v2-start, group_code]
          value_type: string
          variable: group_code
        - value_selector: [rta-v2-start, ai_status]
          value_type: string
          variable: ai_status
        - value_selector: [rta-v2-start, upstream_zero_reason]
          value_type: string
          variable: upstream_zero_reason
        - value_selector: [rta-v2-start, text_passage]
          value_type: string
          variable: text_passage
        - value_selector: [rta-v2-start, transcript]
          value_type: string
          variable: transcript
      height: 54
      id: rta-v2-validate
      position: {x: 380, y: 320}
      positionAbsolute: {x: 380, y: 320}
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 260
      zIndex: 0
    - data:
        cases:
        - case_id: upstream-zero
          conditions:
          - comparison_operator: is
            id: route-upstream-zero-condition
            value: UPSTREAM_ZERO
            varType: string
            variable_selector: [rta-v2-validate, route]
          id: upstream-zero
          logical_operator: and
        - case_id: normal
          conditions:
          - comparison_operator: is
            id: route-normal-condition
            value: NORMAL
            varType: string
            variable_selector: [rta-v2-validate, route]
          id: normal
          logical_operator: and
        selected: false
        title: Input Route
        type: if-else
      height: 190
      id: rta-v2-route
      position: {x: 700, y: 320}
      positionAbsolute: {x: 700, y: 320}
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 250
      zIndex: 0
    - data:
        code: |-
          import json

          COMMENTS = {
              "NO_SPEECH": (
                  "Không phát hiện phần trả lời có giọng nói trong bài làm của bạn.",
                  "Vì không có dữ liệu lời nói để đánh giá, điểm Phát âm và Ngữ điệu của câu này đều là 0.",
                  "Bạn cần kiểm tra micro và đọc thành tiếng toàn bộ đoạn văn trước khi hết thời gian."
              ),
              "WRONG_LANGUAGE_VI": (
                  "Bạn đã sử dụng tiếng Việt thay vì đọc đoạn văn tiếng Anh được yêu cầu.",
                  "Do câu trả lời không đáp ứng ngôn ngữ của bài thi, điểm Phát âm và Ngữ điệu của câu này đều là 0.",
                  "Bạn cần trả lời hoàn toàn bằng tiếng Anh và đọc đúng nội dung được cung cấp."
              ),
              "WRONG_LANGUAGE_OTHER": (
                  "Câu trả lời không sử dụng tiếng Anh theo yêu cầu của bài thi.",
                  "Do không đủ dữ liệu tiếng Anh để đánh giá, điểm Phát âm và Ngữ điệu của câu này đều là 0.",
                  "Bạn cần trả lời hoàn toàn bằng tiếng Anh và đọc đúng nội dung được cung cấp."
              ),
              "WRONG_PASSAGE": (
                  "Bạn đã đọc một đoạn văn khác với nội dung được yêu cầu ở câu hỏi này.",
                  "Do bài đọc không khớp với đoạn văn gốc, điểm Phát âm và Ngữ điệu của câu này đều là 0.",
                  "Bạn nên kiểm tra đúng số câu và đọc chính xác đoạn văn đang hiển thị trước khi bắt đầu."
              ),
          }

          def main(job_id, keycode, question_id, group_code, zero_reason) -> dict:
              reason = zero_reason if zero_reason in COMMENTS else "NO_SPEECH"
              s1, s2, s3 = COMMENTS[reason]
              error_type = "TEXT_ACCURACY" if reason == "WRONG_PASSAGE" else "TASK_COMPLETION"
              errors = [{
                  "error_type": error_type,
                  "severity": "HIGH",
                  "count": 1,
                  "evidence": reason,
                  "message_vi": s1,
              }]
              score_data = {
                  "pronunciation_score": 0,
                  "intonation_stress_score": 0,
                  "question_score_raw": 0.0,
                  "question_score_rounded": 0,
                  "zero_reason": reason,
              }
              result = {
                  "schema_version": "rta-question-result-v1",
                  "job_id": job_id,
                  "keycode": keycode,
                  "question_id": question_id,
                  "group_code": group_code,
                  "status": "COMPLETED",
                  **score_data,
                  "errors": errors,
                  "comment": {
                      "strength": s1,
                      "improvement": s2,
                      "action": s3,
                      "text": " ".join([s1, s2, s3]),
                  },
                  "versions": {
                      "rubric_version": "rta-q1-q2-rubric-v2",
                      "score_prompt_version": "rta-score-v3",
                      "error_prompt_version": "deterministic-zero-v1",
                      "comment_prompt_version": "deterministic-zero-v1",
                  },
              }
              envelope = lambda event_type, sequence, data: json.dumps({
                  "schema_version": "rta-progress-event-v1",
                  "event_type": event_type,
                  "job_id": job_id,
                  "question_id": question_id,
                  "sequence": sequence,
                  "data": data,
              }, ensure_ascii=False)
              return {
                  **score_data,
                  "errors_json": json.dumps(errors, ensure_ascii=False),
                  "comment_strength": s1,
                  "comment_improvement": s2,
                  "comment_action": s3,
                  "comment_text": " ".join([s1, s2, s3]),
                  "score_event_json": envelope("SCORE_READY", 1, score_data),
                  "errors_event_json": envelope("ERRORS_READY", 2, {"errors": errors}),
                  "comment_event_json": envelope("COMMENT_READY", 3, result["comment"]),
                  "completed_event_json": envelope("QUESTION_COMPLETED", 4, result),
                  "result_json": json.dumps(result, ensure_ascii=False),
              }
        code_language: python3
        outputs:
          comment_action: {children: null, type: string}
          comment_event_json: {children: null, type: string}
          comment_improvement: {children: null, type: string}
          comment_strength: {children: null, type: string}
          comment_text: {children: null, type: string}
          completed_event_json: {children: null, type: string}
          errors_event_json: {children: null, type: string}
          errors_json: {children: null, type: string}
          intonation_stress_score: {children: null, type: number}
          pronunciation_score: {children: null, type: number}
          question_score_raw: {children: null, type: number}
          question_score_rounded: {children: null, type: number}
          result_json: {children: null, type: string}
          score_event_json: {children: null, type: string}
          zero_reason: {children: null, type: string}
        selected: false
        title: Build Upstream Zero Result
        type: code
        variables:
        - value_selector: [rta-v2-start, job_id]
          value_type: string
          variable: job_id
        - value_selector: [rta-v2-start, keycode]
          value_type: string
          variable: keycode
        - value_selector: [rta-v2-start, question_id]
          value_type: string
          variable: question_id
        - value_selector: [rta-v2-start, group_code]
          value_type: string
          variable: group_code
        - value_selector: [rta-v2-validate, normalized_zero_reason]
          value_type: string
          variable: zero_reason
      height: 54
      id: rta-v2-upstream-zero
      position: {x: 1020, y: 80}
      positionAbsolute: {x: 1020, y: 80}
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 280
      zIndex: 0
    - data:
        code: |-
          import json

          def main(job_id, question_id, validation_errors_json) -> dict:
              try:
                  errors = json.loads(validation_errors_json or "[]")
              except Exception:
                  errors = ["invalid input"]
              result = {
                  "schema_version": "rta-question-result-v1",
                  "job_id": job_id,
                  "question_id": question_id,
                  "status": "FAILED",
                  "failure_code": "INVALID_INPUT",
                  "failure_details": errors,
              }
              return {
                  "status": "FAILED",
                  "failure_code": "INVALID_INPUT",
                  "failure_details_json": json.dumps(errors, ensure_ascii=False),
                  "result_json": json.dumps(result, ensure_ascii=False),
              }
        code_language: python3
        outputs:
          failure_code: {children: null, type: string}
          failure_details_json: {children: null, type: string}
          result_json: {children: null, type: string}
          status: {children: null, type: string}
        selected: false
        title: Build Invalid Input Result
        type: code
        variables:
        - value_selector: [rta-v2-start, job_id]
          value_type: string
          variable: job_id
        - value_selector: [rta-v2-start, question_id]
          value_type: string
          variable: question_id
        - value_selector: [rta-v2-validate, validation_errors_json]
          value_type: string
          variable: validation_errors_json
      height: 54
      id: rta-v2-invalid
      position: {x: 1020, y: 700}
      positionAbsolute: {x: 1020, y: 700}
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 280
      zIndex: 0
    - data:
        context:
          enabled: false
          variable_selector: []
        model:
          completion_params:
            json_schema: '{"type":"object","additionalProperties":false,"properties":{"pronunciation_score":{"type":"integer","enum":[0,1,2,3]},"intonation_stress_score":{"type":"integer","enum":[0,1,2,3]},"alignment_ratio":{"type":"number","minimum":0,"maximum":1},"completion_ratio":{"type":"number","minimum":0,"maximum":1},"proper_noun_error_count":{"type":"integer","minimum":0},"content_word_error_count":{"type":"integer","minimum":0},"suffix_slip_count":{"type":"integer","minimum":0},"wrong_passage":{"type":"boolean"}},"required":["pronunciation_score","intonation_stress_score","alignment_ratio","completion_ratio","proper_noun_error_count","content_word_error_count","suffix_slip_count","wrong_passage"]}'
            max_output_tokens: 2000
            temperature: 0.1
            thinking_budget: 0
            thinking_mode: false
          mode: chat
          name: gemini-3.8-flash
          provider: langgenius/gemini/google
        prompt_template:
        - id: rta-v2-score-system
          role: system
          text: |-
            You are an official IIG Viet Nam examiner grading TOEIC Speaking Part 1: Read a Text Aloud.

            UPSTREAM CONTRACT
            The upstream pipeline has already completed speech-to-text and technical audio routing. The response reaching this node is READY_FOR_AI and contains assessable English speech.

            Do not transcribe the audio again. Do not classify the response as silence, noise, missing audio, Vietnamese speech, or a technical failure. Do not return rationales, feedback, evidence, markdown, transcript, or a final combined score. Return only the required structured fields.

            SOURCE PRIORITY
            1. The OFFICIAL PASSAGE is the only source of truth for the expected content.
            2. Use the UPSTREAM TRANSCRIPT to estimate textual alignment, completion, omissions, substitutions, and insertions.
            3. Use the attached audio to assess actual pronunciation, intelligibility, rhythm, stress, pauses, phrasing, and pitch.
            4. The transcript may contain STT normalization or recognition errors. Treat equivalent forms such as "50%" and "fifty percent" as matching content. Ignore harmless punctuation, capitalization, article, and formatting differences.
            5. Do not infer an expected word, number, name, or phrase that is absent from the OFFICIAL PASSAGE.

            TEXT ALIGNMENT SIGNALS
            alignment_ratio is 0..1 and represents how closely the candidate's key content follows the official passage. Equivalent spoken and written forms count as matches.
            completion_ratio is 0..1 and represents the proportion of the official passage actually attempted. Repetitions and inserted words must not increase completion. Missing only one or two final words may still be near-complete.
            Set wrong_passage true only when key-content alignment is below 0.50 and the candidate clearly reads a different passage. A heavily accented, incomplete, or poorly pronounced attempt at the correct passage is not a wrong passage.

            PRONUNCIATION (0-3)
            Assess vowels, consonants, blends, important ending sounds, word stress, and overall intelligibility.
            3: Highly intelligible and accurate overall. A few minor slips are allowed. Fewer than three minor suffix slips such as omitted -s, -es, -ed, or -d may still receive 3 when delivery remains clear and smooth.
            2: Generally intelligible with several noticeable sound, stress, or ending errors, but the listener can follow without substantial effort. A serious proper-noun error or several important content-word errors normally prevents 3.
            1: Intelligible only at times; strong other-language influence, frequent errors, or severe incompleteness requires substantial listener effort. This is the minimum for an assessable attempt at the correct passage.
            0: Only when wrong_passage is true.

            INTONATION_AND_STRESS (0-3)
            Assess rhythm, phrasing, word stress, sentence stress, logical pauses, pitch movement, and continuity.
            3: Phrasing, stress, pauses, rhythm, and pitch are appropriate overall; minor local lapses are allowed.
            2: Generally appropriate with noticeable lapses. A brief initial hesitation under three seconds, up to two immediate self-corrections, or minor sentence-ending intonation slips are lenient when the candidate recovers.
            1: Mostly inappropriate or heavily disrupted; delivery may be word-by-word, monotone, excessively hesitant, fragmented, or affected by frequent fillers or repetitions.
            0: Only when wrong_passage is true.

            CONSISTENCY GUIDANCE
            The component scores are preliminary. A downstream deterministic Code node is authoritative for all hard caps and final rounding. Use these thresholds consistently when estimating the preliminary scores and signals, but do not calculate a final score:
            - completion below 0.67 indicates severe incompleteness;
            - completion from 0.67 to below 0.90 indicates meaningful incompleteness;
            - completion at or above 0.90 has no completion cap;
            - if pronunciation is 1, intonation_and_stress must not exceed 1;
            - if wrong_passage is false, neither component may be 0.

            ERROR COUNTING SIGNALS
            proper_noun_error_count: count only serious omissions or clearly incorrect readings of names, places, organizations, or brands. Do not count a minor accent difference when the name remains identifiable.
            content_word_error_count: count clear omissions or substitutions of meaning-bearing nouns, main verbs, adjectives, adverbs, numbers, dates, or prices. Exclude proper nouns and suffix slips already counted separately. Equivalent forms such as "50%" and "fifty percent" are not errors.
            suffix_slip_count: count only minor grammatical ending slips such as missing or incorrect -s, -es, -ed, or -d when the base word remains recognizable.
            Count each occurrence in only one category. An immediately corrected slip must not be counted twice.

            OUTPUT CONTRACT
            Return only pronunciation_score, intonation_stress_score, alignment_ratio, completion_ratio, proper_noun_error_count, content_word_error_count, suffix_slip_count, and wrong_passage. Do not return any additional field.
