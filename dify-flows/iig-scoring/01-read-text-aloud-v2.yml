    - data:
        code: |-
          import json
          import math
          import re
          from difflib import SequenceMatcher

          def tokens(value):
              return re.findall(r"[a-z0-9']+", (value or "").lower())

          def main(job_id, question_id, text_passage, transcript,
                   pronunciation_score, intonation_stress_score,
                   alignment_ratio, completion_ratio, proper_noun_error_count,
                   content_word_error_count, suffix_slip_count,
                   wrong_passage) -> dict:
              reference = tokens(text_passage)
              response = tokens(transcript)
              matcher = SequenceMatcher(a=reference, b=response, autojunk=False)
              matched = sum(block.size for block in matcher.get_matching_blocks())
              deterministic_coverage = matched / max(len(reference), 1)
              transcript_length_ratio = min(len(response) / max(len(reference), 1), 1.0)

              alignment = max(0.0, min(1.0, max(float(alignment_ratio), deterministic_coverage)))
              completion = max(0.0, min(1.0, max(float(completion_ratio), deterministic_coverage)))
              pronunciation = max(0, min(3, int(pronunciation_score)))
              intonation = max(0, min(3, int(intonation_stress_score)))

              is_wrong_passage = bool(wrong_passage) and alignment < 0.50
              zero_reason = "WRONG_PASSAGE" if is_wrong_passage else "NONE"

              if zero_reason != "NONE":
                  pronunciation = 0
                  intonation = 0
              else:
                  # An assessable attempt at the correct passage cannot receive 0.
                  pronunciation = max(1, pronunciation)
                  intonation = max(1, intonation)
                  if completion < 0.67:
                      pronunciation = min(pronunciation, 1)
                      intonation = min(intonation, 1)
                  elif completion < 0.90:
                      pronunciation = min(pronunciation, 2)
                      intonation = min(intonation, 2)
                  if int(proper_noun_error_count) >= 1:
                      pronunciation = min(pronunciation, 2)
                  if int(content_word_error_count) >= 4:
                      pronunciation = min(pronunciation, 2)
                  if pronunciation == 1:
                      intonation = min(intonation, 1)

              raw = (pronunciation + intonation) / 2.0
              rounded = math.floor(raw + 0.5)
              rule_signals = {
                  "alignment_ratio": round(alignment, 4),
                  "completion_ratio": round(completion, 4),
                  "transcript_length_ratio": round(transcript_length_ratio, 4),
                  "proper_noun_error_count": int(proper_noun_error_count),
                  "content_word_error_count": int(content_word_error_count),
                  "suffix_slip_count": int(suffix_slip_count),
                  "wrong_passage": zero_reason == "WRONG_PASSAGE",
              }
              score_data = {
                  "pronunciation_score": pronunciation,
                  "intonation_stress_score": intonation,
                  "question_score_raw": raw,
                  "question_score_rounded": rounded,
                  "zero_reason": zero_reason,
                  "rule_signals": rule_signals,
              }
              event = {
                  "schema_version": "rta-progress-event-v1",
                  "event_type": "SCORE_READY",
                  "job_id": job_id,
                  "question_id": question_id,
                  "sequence": 1,
                  "data": score_data,
              }
              return {
                  "pronunciation_score": pronunciation,
                  "intonation_stress_score": intonation,
                  "question_score_raw": raw,
                  "question_score_rounded": rounded,
                  "zero_reason": zero_reason,
                  "alignment_ratio": alignment,
                  "completion_ratio": completion,
                  "rule_signals_json": json.dumps(rule_signals, ensure_ascii=False),
                  "score_event_json": json.dumps(event, ensure_ascii=False),
              }
