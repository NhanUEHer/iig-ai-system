app:
  description: >-
    Scores one TOEIC Speaking Read Text Aloud question (Q1 or Q2) after upstream
    STT. Produces component scores, normalized errors, a three-sentence Vietnamese
    comment, and progressive event payloads for Dify streaming consumers.
  icon: "U0001F5E3️"
  icon_background: '#E4FBCC'
  icon_type: emoji
  mode: workflow
  name: IIG RTA Question Flow v2
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/gemini:0.9.10@4979b8843fa46c3c2143d339f5868f04d9d77166616c00dd9f811a4adfce03ab
    version: null
kind: app
version: 0.7.0
