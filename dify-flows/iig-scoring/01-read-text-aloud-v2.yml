    - data:
        code: |-
          import json
          import re
          from difflib import SequenceMatcher

          ALLOWED = {"PRONUNCIATION", "TEXT_ACCURACY", "PAUSING", "INTONATION_STRESS", "FLUENCY", "TASK_COMPLETION"}
          SEVERITIES = {"LOW", "MEDIUM", "HIGH"}
          SEVERITY_RANK = {"LOW": 1, "MEDIUM": 2, "HIGH": 3}
          TYPE_PRIORITY = {
              "TASK_COMPLETION": 6,
              "TEXT_ACCURACY": 5,
              "PRONUNCIATION": 4,
              "FLUENCY": 3,
              "PAUSING": 2,
              "INTONATION_STRESS": 1,
          }

          def clean_text(value, limit):
              return " ".join(str(value or "").split())[:limit]

          def normalized_phrase(value):
              return " ".join(re.findall(r"[a-z0-9']+", str(value or "").lower()))

          def numeric_forms(value):
              return re.findall(r"(?<!\w)\d+(?:[.,]\d+)?%?(?!\w)", str(value or ""))

          def numeric_key(value):
              return str(value or "").replace(",", ".").rstrip("%").strip()

          def unique_numeric_mismatch(text_passage, transcript):
              expected = numeric_forms(text_passage)
              actual = numeric_forms(transcript)
              expected_keys = {numeric_key(item) for item in expected}
              actual_keys = {numeric_key(item) for item in actual}
              expected_only = [item for item in expected if numeric_key(item) not in actual_keys]
              actual_only = [item for item in actual if numeric_key(item) not in expected_keys]
              if len(expected_only) == 1 and len(actual_only) == 1:
                  return expected_only[0], actual_only[0]
              return None

          def first_text_difference(text_passage, transcript):
              expected = re.findall(r"[a-z0-9']+", str(text_passage or "").lower())
              actual = re.findall(r"[a-z0-9']+", str(transcript or "").lower())
              matcher = SequenceMatcher(a=expected, b=actual, autojunk=False)
              for tag, i1, i2, j1, j2 in matcher.get_opcodes():
                  if tag == "equal":
                      continue
                  expected_form = " ".join(expected[i1:i2])[:100]
                  actual_form = " ".join(actual[j1:j2])[:100]
                  if tag == "delete" and expected_form:
                      return expected_form, f'Thí sinh bỏ cụm "{expected_form}" trong bài chuẩn.'
                  if tag == "insert" and actual_form:
                      return actual_form, f'Thí sinh đọc thêm cụm "{actual_form}" không có trong bài chuẩn.'
                  if expected_form and actual_form:
                      return actual_form, f'Bài chuẩn là "{expected_form}" nhưng thí sinh đọc thành "{actual_form}".'
              return None

          def main(job_id, question_id, text_passage, transcript, error_output,
                   pronunciation_score, intonation_stress_score,
                   completion_ratio, content_word_error_count) -> dict:
              raw = (error_output or {}).get("errors", []) if isinstance(error_output, dict) else []
              numeric_mismatch = unique_numeric_mismatch(text_passage, transcript)
              normalized = []
              by_exact_key = {}

              def append_unique(candidate):
                  key = (
                      candidate["error_type"],
                      clean_text(candidate["evidence"], 100).lower(),
                      clean_text(candidate["message_vi"], 240).lower(),
                  )
                  existing = by_exact_key.get(key)
                  if existing:
                      existing["count"] = max(existing["count"], candidate["count"])
                      if SEVERITY_RANK[candidate["severity"]] > SEVERITY_RANK[existing["severity"]]:
                          existing["severity"] = candidate["severity"]
                      return
                  by_exact_key[key] = candidate
                  normalized.append(candidate)

              for item in raw:
                  if not isinstance(item, dict):
                      continue
                  error_type = str(item.get("error_type", "")).upper()
                  severity = str(item.get("severity", "")).upper()
                  if error_type not in ALLOWED or severity not in SEVERITIES:
                      continue
                  evidence = clean_text(item.get("evidence"), 100)
                  message = clean_text(item.get("message_vi"), 240)
                  if error_type == "TASK_COMPLETION" and float(completion_ratio) >= 0.98:
                      continue
                  if error_type == "TEXT_ACCURACY":
                      normalized_evidence = normalized_phrase(evidence)
                      omission = "bỏ" in message.lower() or "thiếu" in message.lower()
                      grounded_source = text_passage if omission else transcript
                      if not normalized_evidence or normalized_evidence not in normalized_phrase(grounded_source):
                          continue
                  if error_type == "PRONUNCIATION" and int(pronunciation_score) >= 3 and severity == "HIGH":
                      severity = "MEDIUM"
                  if error_type in {"PAUSING", "INTONATION_STRESS", "FLUENCY"} and int(intonation_stress_score) >= 3 and severity == "HIGH":
                      severity = "MEDIUM"
                  if error_type in {"PRONUNCIATION", "TEXT_ACCURACY"} and not evidence:
                      continue
                  candidate = {
                      "error_type": error_type,
                      "severity": severity,
                      "count": max(1, min(99, int(item.get("count", 1)))),
                      "evidence": evidence,
                      "message_vi": message,
                      "_deterministic_priority": 0,
                  }
                  append_unique(candidate)

              if numeric_mismatch:
                  expected_form, actual_form = numeric_mismatch
                  append_unique({
                      "error_type": "TEXT_ACCURACY",
                      "severity": "MEDIUM",
                      "count": 1,
                      "evidence": actual_form,
                      "message_vi": f'Bài chuẩn là "{expected_form}" nhưng thí sinh đọc thành "{actual_form}".',
                      "_deterministic_priority": 1,
                  })

              if int(content_word_error_count) > 0 and not any(
                  item["error_type"] == "TEXT_ACCURACY" for item in normalized
              ):
                  text_difference = first_text_difference(text_passage, transcript)
                  if text_difference:
                      evidence, message = text_difference
                      append_unique({
                          "error_type": "TEXT_ACCURACY",
                          "severity": "LOW",
                          "count": max(1, min(99, int(content_word_error_count))),
                          "evidence": evidence,
                          "message_vi": message,
                          "_deterministic_priority": 0,
                      })

              selected = sorted(
                  normalized,
                  key=lambda item: (
                      -item.get("_deterministic_priority", 0),
                      -SEVERITY_RANK[item["severity"]],
                      -TYPE_PRIORITY[item["error_type"]],
                      -item["count"],
                  ),
              )
              normalized = []
              for item in selected:
                  item.pop("_deterministic_priority", None)
                  normalized.append(item)

              counts = {}
              for item in normalized:
                  counts[item["error_type"]] = counts.get(item["error_type"], 0) + item["count"]
              ordered = sorted(counts.items(), key=lambda pair: (-pair[1], pair[0]))
              summary = "; ".join(f"{name}: {count}" for name, count in ordered) or "Không phát hiện lỗi nổi bật"
              data = {"errors": normalized, "error_counts": counts, "summary": summary}
              event = {
                  "schema_version": "rta-progress-event-v1",
                  "event_type": "ERRORS_READY",
                  "job_id": job_id,
                  "question_id": question_id,
                  "sequence": 2,
                  "data": data,
              }
              return {
                  "errors_json": json.dumps(normalized, ensure_ascii=False),
                  "error_counts_json": json.dumps(counts, ensure_ascii=False),
                  "error_summary": summary,
                  "errors_event_json": json.dumps(event, ensure_ascii=False),
              }
