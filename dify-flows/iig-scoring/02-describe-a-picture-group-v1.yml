    - data:
        code: |
          import json
          def main(job_id, keycode, group_code, questions_json, deterministic_group_score, llm_group_final_score) -> dict:
              proposed = int(llm_group_final_score)
              if proposed < 0 or proposed > 3: raise ValueError("LLM group score is invalid")
              authoritative = int(deterministic_group_score)
              if authoritative < 0 or authoritative > 3: raise ValueError("deterministic group score is invalid")
              result = {"schema_version": "describe-picture-group-result-v1", "group_code": group_code, "group_final_score": authoritative, "versions": {"group_prompt": "describe-picture-group-prompt-v2"}}
              return {"group_final_score": authoritative, "result_json": json.dumps(result, ensure_ascii=False)}
        code_language: python3
        outputs:
          group_final_score:
            children:
            type: number
          result_json:
            children:
            type: string
        selected: false
        title: Validate Group Decision and Build Result
        type: code
        variables:
        - value_selector:
