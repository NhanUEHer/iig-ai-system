    - data:
        code: |
          import json
          FIELDS = {"question_id", "pronunciation_score", "intonation_fluency_score", "grammar_score", "vocabulary_score", "cohesion_score", "final_score"}
          def score(value, field):
              number = int(value)
              if isinstance(value, bool) or number < 0 or number > 3: raise ValueError(f"{field} must be 0..3")
              return number
          def main(schema_version, job_id, keycode, group_code, questions_json) -> dict:
              if schema_version != "describe-picture-group-input-v1": raise ValueError("invalid schema_version")
              if not (job_id or "").strip() or not (keycode or "").strip(): raise ValueError("job_id and keycode are required")
              if group_code != "DESCRIBE_PICTURE": raise ValueError("group_code must be DESCRIBE_PICTURE")
              questions = json.loads(questions_json)
              if not isinstance(questions, list) or len(questions) != 2: raise ValueError("exactly two questions are required")
              normalized = {}
              for raw in questions:
                  if not isinstance(raw, dict) or set(raw.keys()) != FIELDS: raise ValueError("question fields do not match contract")
                  qid = str(raw["question_id"]).lower()
                  if qid not in {"s_q3", "s_q4"} or qid in normalized: raise ValueError("questions must be unique s_q3 and s_q4")
                  normalized[qid] = {name: (qid if name == "question_id" else score(raw[name], name)) for name in FIELDS}
              if set(normalized) != {"s_q3", "s_q4"}: raise ValueError("questions must contain s_q3 and s_q4")
              ordered = [normalized["s_q3"], normalized["s_q4"]]
              q3, q4 = ordered
              lower, higher = sorted([q3["final_score"], q4["final_score"]])
              score_matrix = {
                  (0, 0): 0, (0, 1): 0, (0, 2): 1, (0, 3): 1,
                  (1, 1): 1, (1, 2): 1, (1, 3): 2,
                  (2, 2): 2, (2, 3): 2, (3, 3): 3,
              }
              component_names = ["pronunciation_score", "intonation_fluency_score", "grammar_score", "vocabulary_score", "cohesion_score"]
              component_averages = {
                  name: (q3[name] + q4[name]) / 2.0 for name in component_names
              }
              facts = {
                  "questions": ordered,
                  "question_final_pair": [q3["final_score"], q4["final_score"]],
                  "average_question_final": (q3["final_score"] + q4["final_score"]) / 2.0,
                  "score_gap": abs(q3["final_score"] - q4["final_score"]),
                  "component_averages": component_averages,
                  "repeated_weak_components": [
                      name for name in component_names if q3[name] <= 1 and q4[name] <= 1
                  ],
                  "deterministic_group_score": score_matrix[(lower, higher)],
              }
              return {
                  "normalized_questions_json": json.dumps(ordered, ensure_ascii=False),
                  "policy_context_json": json.dumps(facts, ensure_ascii=False),
                  "deterministic_group_score": score_matrix[(lower, higher)],
              }
        code_language: python3
        outputs:
          normalized_questions_json:
            children:
            type: string
          policy_context_json:
            children:
            type: string
          deterministic_group_score:
            children:
            type: number
        selected: false
        title: Validate and Prepare Group Input
