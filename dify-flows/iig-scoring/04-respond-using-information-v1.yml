                  if (not long_form and seconds < 5) or (long_form and seconds < 12): scores["completeness_score"]=min(scores["completeness_score"],2); rules.append("PACING_COMPLETENESS_CAP")
              avg=sum(scores.values())/7.0; rounded=math.floor(avg+0.5)
