    - data:
        code: |
          def main(schema_version,job_id,keycode,question_id,question_number,group_code,scorer_type,response_profile,ai_status,upstream_zero_reason,question,transcript,context) -> dict:
              errors=[]; reason=(upstream_zero_reason or "NONE").strip().upper(); ids=["s_q8", "s_q9", "s_q10"]; profiles=["SHORT_INFORMATION", "MULTI_ITEM_INFORMATION"]
              if schema_version!="respond-information-question-input-v1": errors.append("invalid schema_version")
              if not (job_id or "").strip() or not (keycode or "").strip(): errors.append("job_id and keycode are required")
              if question_id not in ids or int(question_number)!=int(question_id[3:]): errors.append("question identity mismatch")
              if group_code!="RESPOND_USING_INFORMATION" or scorer_type!="RESPOND_USING_INFORMATION": errors.append("scorer identity mismatch")
              expected=profiles[1] if question_id==ids[-1] else profiles[0]
              if response_profile!=expected: errors.append("response_profile mismatch")
              if not (question or "").strip(): errors.append("question is required")
              if reason not in {"NONE","NO_SPEECH","WRONG_LANGUAGE_VI","WRONG_LANGUAGE_OTHER"}: errors.append("invalid zero reason")
              if reason!="NONE": route="UPSTREAM_ZERO" if ai_status=="ZERO_SCORE" else "INVALID"
              else: route="NORMAL" if ai_status=="READY_FOR_AI" and (transcript or "").strip() else "INVALID"
              if errors: route="INVALID"
              return {"route":route,"validation_ok":route!="INVALID","validation_errors_json":__import__("json").dumps(errors,ensure_ascii=False),"normalized_zero_reason":reason}
        code_language: python3
        outputs:
          route:
            children:
            type: string
          validation_ok:
            children:
            type: boolean
          validation_errors_json:
            children:
            type: string
          normalized_zero_reason:
            children:
            type: string
