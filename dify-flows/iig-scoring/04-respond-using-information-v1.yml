          import json, math, re
          SCORE_KEYS = ["pronunciation_score","intonation_fluency_score","grammar_score","vocabulary_score","cohesion_score","relevance_score","completeness_score"]
          STOPWORDS = {"a","an","and","are","as","at","be","by","do","does","for","from","how","i","if","in","is","it","of","on","or","the","this","to","what","when","where","which","who","why","with","would","you","your"}
          def required_integer(value, label):
              if value is None or value == "": raise ValueError(label + " is required")
              try: parsed = int(value)
              except Exception: raise ValueError(label + " must be an integer")
              if parsed < 0 or parsed > 3: raise ValueError(label + " must be between 0 and 3")
              return parsed
          def integer(value, default=0):
              try: return int(value)
              except Exception: return default
          def number(value, default=0.0):
              try: return float(value)
              except Exception: return default
          def as_bool(value, default=False):
              if isinstance(value, bool): return value
              if isinstance(value, (int, float)): return value != 0
              if isinstance(value, str):
                  normalized=value.strip().lower()
                  if normalized in {"true","1","yes","on"}: return True
                  if normalized in {"false","0","no","off",""}: return False
              return default
          def terms(value):
              return {token for token in re.findall(r"[a-z0-9]+", str(value or "").lower()) if len(token) > 2 and token not in STOPWORDS}
          def main(job_id, question_id, response_profile, response_word_count, audio_duration_seconds,
                   question, context, transcript, score_output) -> dict:
              if isinstance(score_output, str):
                  try: raw=json.loads(score_output)
                  except Exception: raise ValueError("score_output must be valid JSON")
              elif isinstance(score_output, dict): raw=score_output
              else: raise ValueError("score_output is required")
              scores = {k:required_integer(raw.get(k), k) for k in SCORE_KEYS}
              alignment=max(0.0,min(1.0,number(raw.get("topic_alignment_ratio"))))
              words=max(0,integer(response_word_count)); seconds=max(0.0,number(audio_duration_seconds))
              task_terms=terms(str(question or "") + " " + str(context or "")); response_terms=terms(transcript)
              matched_terms=sorted(task_terms & response_terms)
              text_alignment=min(1.0, len(matched_terms) / max(1, min(5, len(task_terms))))
              signals={"topic_alignment_ratio":round(alignment,4),"text_alignment_ratio":round(text_alignment,4),"matched_topic_term_count":len(matched_terms),"subquestions_total":max(1,integer(raw.get("subquestions_total"),1)),"subquestions_answered":max(0,integer(raw.get("subquestions_answered"))),"requested_details_total":max(0,integer(raw.get("requested_details_total"))),"requested_details_correct":max(0,integer(raw.get("requested_details_correct"))),"factual_error":as_bool(raw.get("factual_error")) if True else False,"response_word_count":words,"effective_speaking_seconds":seconds,"cut_off":as_bool(raw.get("cut_off")),"excessive_fillers":as_bool(raw.get("excessive_fillers")),"long_hesitation":as_bool(raw.get("long_hesitation")),"completely_unrelated":as_bool(raw.get("completely_unrelated"))}
              rules=[]
              if signals["completely_unrelated"] and (alignment >= 0.50 or len(matched_terms) >= 2):
                  signals["completely_unrelated"]=False
                  signals["topic_alignment_ratio"]=max(signals["topic_alignment_ratio"],0.50)
                  rules.append("UNRELATED_SIGNAL_OVERRIDDEN_BY_TEXT_ALIGNMENT")
              zero = signals["completely_unrelated"] and signals["topic_alignment_ratio"] < 0.50 and len(matched_terms) < 2
              if zero:
