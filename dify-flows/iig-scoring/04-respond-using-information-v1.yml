    - data:
        code: |
          import json
          def main(job_id,keycode,question_id,group_code,response_profile,zero_reason,score_event_json=None)->dict:
              reason=zero_reason if zero_reason in {"NO_SPEECH","WRONG_LANGUAGE_VI","WRONG_LANGUAGE_OTHER","COMPLETELY_UNRELATED"} else "NO_SPEECH"
              comments={
                "NO_SPEECH":("Không phát hiện phần trả lời có giọng nói.","Câu này chưa có nội dung tiếng Anh để đánh giá.","Hãy kiểm tra micro và bắt đầu trả lời ngay sau tín hiệu ghi âm."),
                "WRONG_LANGUAGE_VI":("Hệ thống đã nhận được phần trả lời nhưng nội dung được trình bày bằng tiếng Việt.","Câu trả lời chưa đáp ứng yêu cầu sử dụng tiếng Anh của bài thi.","Hãy chuẩn bị một câu mở đầu tiếng Anh và duy trì tiếng Anh trong toàn bộ phần trả lời."),
                "WRONG_LANGUAGE_OTHER":("Hệ thống đã nhận được phần trả lời nhưng không xác định được nội dung tiếng Anh phù hợp.","Câu trả lời chưa đáp ứng yêu cầu về ngôn ngữ của bài thi.","Hãy trả lời rõ ràng hoàn toàn bằng tiếng Anh trong lần tiếp theo."),
                "COMPLETELY_UNRELATED":("Bạn đã tạo được một phần trả lời có thể nhận diện.","Nội dung trả lời không đúng trọng tâm của câu hỏi hoặc không dựa trên thông tin nguồn.","Hãy xác định từng thông tin được hỏi, đối chiếu với tài liệu rồi mới trả lời.")
              }
              first,second,third=comments[reason]
              scores={k:0 for k in ["pronunciation_score", "intonation_fluency_score", "grammar_score", "vocabulary_score", "cohesion_score", "relevance_score", "completeness_score"]}; comment={"strength":first,"improvement":second,"action":third}; comment["text"]=" ".join(comment.values())
              errors=[{"error_type":"FACTUAL_ACCURACY","severity":"HIGH","count":1,"evidence":[reason],"message_vi":first}]
              result={"schema_version":"respond-information-question-result-v1","job_id":job_id,"keycode":keycode,"question_id":question_id,"group_code":group_code,"response_profile":response_profile,"status":"COMPLETED",**scores,"question_score_raw":0.0,"question_score_rounded":0,"zero_reason":reason,"rule_signals":{},"applied_rules":["BUSINESS_ZERO_"+reason],"errors":errors,"comment":comment,"versions":{"score_prompt_version":"deterministic-zero-v1"}}
              env=lambda t,s,d:json.dumps({"schema_version":"respond-information-progress-event-v1","event_type":t,"job_id":job_id,"question_id":question_id,"sequence":s,"data":d},ensure_ascii=False)
              return {**scores,"question_score_raw":0.0,"question_score_rounded":0,"zero_reason":reason,"errors_json":json.dumps(errors,ensure_ascii=False),"comment_strength":comment["strength"],"comment_improvement":comment["improvement"],"comment_action":comment["action"],"comment_text":comment["text"],"score_event_json":score_event_json or env("SCORE_READY",1,scores),"errors_event_json":env("ERRORS_READY",2,{"errors":errors}),"comment_event_json":env("COMMENT_READY",3,comment),"completed_event_json":env("QUESTION_COMPLETED",4,result),"result_json":json.dumps(result,ensure_ascii=False)}
