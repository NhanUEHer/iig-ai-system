          completion_params:
            json_schema: '{"type":"object","additionalProperties":false,"properties":{"errors":{"type":"array","items":{"type":"object","additionalProperties":false,"properties":{"error_type":{"type":"string","enum":["FACTUAL_ACCURACY","REQUESTED_DETAIL","INFORMATION_DELIVERY","GRAMMAR","VOCABULARY","PRONUNCIATION","INTONATION_FLUENCY","COHESION"]},"severity":{"type":"string","enum":["LOW","MEDIUM","HIGH"]},"count":{"type":"integer","minimum":1},"evidence":{"type":"array","items":{"type":"string"}},"message_vi":{"type":"string"}},"required":["error_type","severity","count","evidence","message_vi"]}}},"required":["errors"]}'
