    - data:
        code: |-
          import json, re, unicodedata
          def clean(value): return re.sub(r'\s+',' ',unicodedata.normalize('NFKC',str(value or ''))).strip()
          def facts(text):
              raw=str(text or ''); stripped=raw.strip()
              words=re.findall(r"\b[\w]+(?:[-'][\w]+)*\b",stripped,flags=re.UNICODE)
              sentences=[x for x in re.split(r'[.!?]+',stripped) if x.strip()]
              paragraphs=[x for x in re.split(r'\n\s*\n',stripped) if x.strip()]
              letters=[x for x in stripped if x.isalpha()]
              return {'response_word_count':len(words),'sentence_count':len(sentences) if stripped else 0,'paragraph_count':len(paragraphs) if stripped else 0,'has_terminal_punctuation':bool(stripped and stripped[-1] in '.!?'),'all_caps':bool(letters and all(x.isupper() for x in letters)),'contraction_count':len(re.findall(r"\b\w+'(?:t|s|re|ve|ll|d|m)\b",stripped,re.I)),'empty_response':not bool(stripped)}
          def main(schema_version,job_id,keycode,question_id,question_number,group_code,scorer_type,ai_status,upstream_zero_reason,question,prompt_text,context_mode,context,student_writing):
              errs=[]; reason=str(upstream_zero_reason or 'NONE').strip().upper(); text=str(student_writing or '').strip()
              if str(schema_version) not in {'1','writing-question-input-v1'}: errs.append('invalid schema_version')
              if not str(job_id or '').strip() or not str(keycode or '').strip(): errs.append('job_id and keycode are required')
              try: q=int(question_number)
              except Exception: q=0
              if question_id!=f'w_q{q}' or q<8 or q>8: errs.append('question identity mismatch')
              if group_code!='WRITE_OPINION_ESSAY' or scorer_type!='WRITE_OPINION_ESSAY': errs.append('scorer identity mismatch')
              allowed={'NONE','BLANK_RESPONSE','NON_ENGLISH_RESPONSE','GIBBERISH_RESPONSE','COPIED_PROMPT','NO_ORIGINAL_CONTENT','COMPLETELY_OFF_TOPIC'}
              if reason not in allowed: errs.append('invalid zero reason')
              if not clean(question) and not clean(prompt_text): errs.append('question or prompt_text is required')
              mode='TEXT'
              if reason=='NONE' and not str(context or '').strip(): errs.append('essay topic context is required')
              if reason!='NONE': route='UPSTREAM_ZERO' if ai_status=='ZERO_SCORE' else 'INVALID'
              else: route='NORMAL' if ai_status=='READY_FOR_AI' and text else 'INVALID'
              if errs: route='INVALID'
              return {'route':route,'validation_ok':route!='INVALID','validation_errors_json':json.dumps(errs,ensure_ascii=False),'normalized_zero_reason':reason,'normalized_context_mode':mode,'deterministic_signals_json':json.dumps(facts(student_writing),ensure_ascii=False)}
        code_language: python3
        outputs:
