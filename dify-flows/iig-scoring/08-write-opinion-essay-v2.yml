                  t=str(x.get('error_type','')).upper(); sev=str(x.get('severity','MEDIUM')).upper()
                  if t not in ALLOWED: continue
                  if sev not in RANK: sev='MEDIUM'
                  ev=x.get('evidence',[]); ev=ev if isinstance(ev,list) else [ev]; ev=list(dict.fromkeys([' '.join(str(v).split()) for v in ev if str(v).strip()]))
