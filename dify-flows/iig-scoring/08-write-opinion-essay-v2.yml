                  cur=grouped.get(t,{'error_type':t,'severity':sev,'count':0,'evidence':[],'message_vi':''}); cur['evidence']=list(dict.fromkeys(cur['evidence']+ev))[:99]; cur['count']=len(cur['evidence'])
                  if RANK[sev]>RANK[cur['severity']]: cur['severity']=sev
