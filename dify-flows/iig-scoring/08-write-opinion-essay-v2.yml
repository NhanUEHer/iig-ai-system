            - If one passage supports more than one genuinely independent error, each category must describe a different defect rather than duplicate the same diagnosis.

            ### 3. EVIDENCE AND MESSAGE RULES

            - Combine repeated occurrences into one object per `error_type`; preserve all unique evidence pieces for that type.
            - Evidence normally consists of exact verbatim strings from the CANDIDATE RESPONSE.
            - OMISSION EVIDENCE EXCEPTION: TASK_RESPONSE, IDEA_SUPPORT, and ORGANIZATION omissions may have no verbatim phrase. For those omissions only, use one concise marker formatted as `[MISSING] <missing stance, reason, example, introduction, body development, or conclusion>`, grounded in LOCKED SCORE SIGNALS.
            - Do not fabricate an error merely because a component is below the maximum; the response or locked signals must support it.
            - `count` must equal the number of unique evidence entries returned for that type.
            - `message_vi` must clearly explain what is wrong and how to improve it in Vietnamese, addressing the learner as "Bạn".
            - Return `errors: []` only when no concrete error or supported omission exists.
