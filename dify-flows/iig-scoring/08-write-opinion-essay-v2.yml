    - data:
        code: |-
          import json
          def main(job_id,keycode,question_id,group_code,zero_reason,score_event_json='')->dict:
              reason=str(zero_reason or 'BLANK_RESPONSE').strip().upper()
              request=group_code=='RESPOND_TO_WRITTEN_REQUEST'
              keys=['task_fulfillment','sentence_quality','vocabulary','organization'] if request else ['opinion_support','grammar','vocabulary','organization']
              error_type='TASK_FULFILLMENT' if request else 'TASK_RESPONSE'
              messages={
                'BLANK_RESPONSE':'Bài làm chưa có nội dung để đánh giá.',
                'NON_ENGLISH_RESPONSE':'Bài làm không sử dụng tiếng Anh đủ để đánh giá.',
                'GIBBERISH_RESPONSE':'Nội dung hiện tại chưa tạo thành bài viết tiếng Anh có nghĩa.',
                'COPIED_PROMPT':'Bài làm chủ yếu sao chép đề và chưa có nội dung trả lời độc lập.',
                'NO_ORIGINAL_CONTENT':'Bài làm chưa có đủ nội dung độc lập để đánh giá.',
                'COMPLETELY_OFF_TOPIC':'Bài làm không trả lời đúng nội dung được yêu cầu.'}
              msg=messages.get(reason,messages['NO_ORIGINAL_CONTENT'])
              result={'schema_version':'writing-question-result-v1','job_id':str(job_id or ''),'keycode':str(keycode or ''),'question_id':str(question_id or ''),'group_code':str(group_code or ''),'status':'COMPLETED','component_scores':{k:0 for k in keys},'question_score_raw':0.0,'question_score_rounded':0,'zero_reason':reason,'rule_signals':{},'applied_rules':['BUSINESS_ZERO_'+reason],'errors':[{'error_type':error_type,'severity':'HIGH','count':1,'evidence':[reason],'message_vi':msg}],'comment':{'strength':'Hệ thống đã nhận được bài làm.','improvement':msg,'action':'Hãy đọc kỹ yêu cầu và viết một câu trả lời tiếng Anh hoàn chỉnh, trực tiếp và có nội dung riêng.','text':'Hệ thống đã nhận được bài làm. '+msg+' Hãy đọc kỹ yêu cầu và viết một câu trả lời tiếng Anh hoàn chỉnh, trực tiếp và có nội dung riêng.'},'versions':{}}
              return {'result_json':json.dumps(result,ensure_ascii=False)}
