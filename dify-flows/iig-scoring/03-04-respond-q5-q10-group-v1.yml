    - data:
        code: |
          import json
          SCORES=["pronunciation_score","intonation_fluency_score","grammar_score","vocabulary_score","cohesion_score","relevance_score","completeness_score","final_score"]
          PROFILES={5:"SHORT_DIRECT_RESPONSE",6:"SHORT_DIRECT_RESPONSE",7:"EXTENDED_RESPONSE",8:"SHORT_INFORMATION",9:"SHORT_INFORMATION",10:"MULTI_ITEM_INFORMATION"}
          SCORERS={5:"RESPOND_TO_QUESTIONS",6:"RESPOND_TO_QUESTIONS",7:"RESPOND_TO_QUESTIONS",8:"RESPOND_USING_INFORMATION",9:"RESPOND_USING_INFORMATION",10:"RESPOND_USING_INFORMATION"}
          ALLOWED={"question_id","question_number","scorer_type","response_profile",*SCORES}
          def integer_score(value,field):
              if isinstance(value,bool): raise ValueError(field+" must be an integer from 0 to 3")
              try: number=int(value)
              except (TypeError,ValueError): raise ValueError(field+" must be an integer from 0 to 3")
              if number<0 or number>3 or (str(value).strip() not in {str(number),str(float(number))}): raise ValueError(field+" must be an integer from 0 to 3")
              return number
          def main(schema_version,job_id,keycode,group_code,questions_json)->dict:
              if schema_version!="respond-q5-q10-group-input-v1": raise ValueError("schema_version must be respond-q5-q10-group-input-v1")
              if not str(job_id or "").strip() or not str(keycode or "").strip(): raise ValueError("job_id and keycode are required")
              if group_code!="RESPOND_Q5_Q10": raise ValueError("group_code must be RESPOND_Q5_Q10")
              try: raw=json.loads(questions_json)
              except Exception as error: raise ValueError("questions_json must be valid JSON") from error
              if not isinstance(raw,list) or len(raw)!=6: raise ValueError("questions_json must contain exactly six questions")
              normalized=[]
              for index,q in enumerate(raw):
                  number=index+5; expected_id=f"s_q{number}"
                  if not isinstance(q,dict): raise ValueError("each question must be an object")
                  unknown=set(q.keys())-ALLOWED; missing=ALLOWED-set(q.keys())
                  if unknown: raise ValueError("unknown question fields: "+", ".join(sorted(unknown)))
                  if missing: raise ValueError("missing question fields: "+", ".join(sorted(missing)))
                  if str(q.get("question_id","")).strip().lower()!=expected_id or int(q.get("question_number",-1))!=number: raise ValueError("questions must be ordered s_q5 through s_q10")
                  if str(q.get("scorer_type","")).strip()!=SCORERS[number]: raise ValueError(expected_id+" scorer_type is invalid")
                  if str(q.get("response_profile","")).strip()!=PROFILES[number]: raise ValueError(expected_id+" response_profile is invalid")
                  item={"question_id":expected_id,"question_number":number,"scorer_type":SCORERS[number],"response_profile":PROFILES[number]}
                  for field in SCORES: item[field]=integer_score(q.get(field),expected_id+"."+field)
                  normalized.append(item)
              finals=[q["final_score"] for q in normalized]; ordered=sorted(finals)
              component_averages={field:round(sum(q[field] for q in normalized)/6.0,3) for field in SCORES[:-1]}
              component_low_counts={field:sum(q[field]<=1 for q in normalized) for field in SCORES[:-1]}
              facts={
                  "question_finals":finals,"average_final":round(sum(finals)/6.0,3),"median_final":(ordered[2]+ordered[3])/2.0,
                  "zero_count":sum(v==0 for v in finals),"score_1_count":sum(v==1 for v in finals),"score_2_count":sum(v==2 for v in finals),"score_3_count":sum(v==3 for v in finals),
                  "low_question_count":sum(v<=1 for v in finals),"strong_question_count":sum(v>=2 for v in finals),
                  "q5_q6_average":round(sum(finals[0:2])/2.0,3),"q7_final":finals[2],"q8_q9_average":round(sum(finals[3:5])/2.0,3),"q10_final":finals[5],
                  "component_averages":component_averages,"component_low_counts":component_low_counts
              }
              return {"normalized_questions_json":json.dumps(normalized,ensure_ascii=False),"policy_context_json":json.dumps(facts,ensure_ascii=False)}
        code_language: python3
        outputs:
