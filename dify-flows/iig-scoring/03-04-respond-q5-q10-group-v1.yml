    - data:
        code: |
          import json
          def main(job_id,keycode,group_code,questions_json,llm_group_final_score,llm_applied_rules)->dict:
              qs=json.loads(questions_json); proposed=max(0,min(3,int(llm_group_final_score))); rules=list(llm_applied_rules or [])
              finals=[int(q["final_score"]) for q in qs]
              average=sum(finals)/6.0
              if all(v==0 for v in finals): proposed=0; rules.append("ALL_QUESTIONS_ZERO")
              elif proposed==0: proposed=1; rules.append("NONZERO_ATTEMPT_FLOOR")
              low_count=sum(v<=1 for v in finals); perfect_count=sum(v==3 for v in finals)
              if proposed>=2 and (low_count>=4 or (qs[2]["final_score"]<=1 and qs[5]["final_score"]<=1 and average<1.5)):
                  proposed=1; rules.append("GROUP_LOW_PERFORMANCE_CAP")
              if proposed==1 and average>=2.5 and low_count==0:
                  proposed=2; rules.append("GROUP_HIGH_DISTRIBUTION_FLOOR")
              if proposed==3 and (average<2.5 or perfect_count<3 or qs[2]["final_score"]<2 or qs[5]["final_score"]<2 or low_count>=2):
                  proposed=2; rules.append("GROUP_EXCELLENT_CAP")
              result={"schema_version":"respond-q5-q10-group-result-v1","job_id":job_id,"keycode":keycode,"group_code":group_code,"status":"COMPLETED","group_final_score":proposed,"applied_rules":list(dict.fromkeys(rules)),"versions":{"group_prompt_version":"respond-q5-q10-group-prompt-v2"}}
              return {"group_final_score":proposed,"result_json":json.dumps(result,ensure_ascii=False)}
        code_language: python3
        outputs:
          group_final_score:
            children:
            type: number
          result_json:
            children:
            type: string
