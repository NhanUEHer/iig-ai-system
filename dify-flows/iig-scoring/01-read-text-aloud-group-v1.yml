      id: rta-group-llm-source-rta-group-finalize-target
      source: rta-group-llm
      sourceHandle: source
      target: rta-group-finalize
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: code
        targetType: end
      id: rta-group-finalize-source-rta-group-end-target
      source: rta-group-finalize
      sourceHandle: source
      target: rta-group-end
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        selected: false
        title: Group Score Input
        type: start
        variables:
        - default: rta-group-input-v1
          hint: Fixed input contract version.
          label: schema_version
          options: []
          placeholder: ''
          required: true
          type: text-input
          variable: schema_version
        - default: ''
          hint: Scoring job UUID shared by Q1 and Q2.
          label: job_id
          options: []
          placeholder: ''
          required: true
          type: text-input
          variable: job_id
        - default: ''
          hint: Candidate attempt keycode.
          label: keycode
          options: []
          placeholder: ''
          required: true
          type: text-input
          variable: keycode
        - default: READ_TEXT_ALOUD
          hint: Fixed score group for TOEIC Speaking Q1-Q2.
          label: group_code
          options:
          - READ_TEXT_ALOUD
          placeholder: ''
          required: true
          type: select
          variable: group_code
        - default: '[]'
          hint: >-
            JSON array with exactly s_q1 and s_q2. Each item must contain
            question_id, pronunciation_score, intonation_stress_score and
            final_score.
          label: questions_json
          options: []
          placeholder: '[{"question_id":"s_q1",...},{"question_id":"s_q2",...}]'
          required: true
          type: paragraph
          variable: questions_json
      height: 260
      id: rta-group-start
      position: {x: 40, y: 260}
      positionAbsolute: {x: 40, y: 260}
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 280
      zIndex: 0
    - data:
        code: |-
          import json

          SCORE_MATRIX = {
              (0, 0): 0, (0, 1): 0, (0, 2): 1, (0, 3): 1,
              (1, 0): 0, (1, 1): 1, (1, 2): 1, (1, 3): 2,
              (2, 0): 1, (2, 1): 1, (2, 2): 2, (2, 3): 2,
              (3, 0): 1, (3, 1): 2, (3, 2): 2, (3, 3): 3,
          }

          def integer_score(value, field):
              if isinstance(value, bool):
                  raise ValueError(f"{field} must be an integer from 0 to 3")
              try:
                  number = int(value)
              except (TypeError, ValueError):
                  raise ValueError(f"{field} must be an integer from 0 to 3")
              if number != value and str(value).strip() != str(number):
                  raise ValueError(f"{field} must be an integer from 0 to 3")
              if number < 0 or number > 3:
                  raise ValueError(f"{field} must be an integer from 0 to 3")
              return number

          def main(schema_version, job_id, keycode, group_code, questions_json) -> dict:
              if schema_version != "rta-group-input-v1":
                  raise ValueError("schema_version must be rta-group-input-v1")
              if not (job_id or "").strip():
                  raise ValueError("job_id is required")
              if not (keycode or "").strip():
                  raise ValueError("keycode is required")
              if group_code != "READ_TEXT_ALOUD":
                  raise ValueError("group_code must be READ_TEXT_ALOUD")

              try:
                  questions = json.loads(questions_json)
              except Exception as error:
                  raise ValueError("questions_json must be valid JSON") from error
              if not isinstance(questions, list) or len(questions) != 2:
                  raise ValueError("questions_json must contain exactly two questions")

              allowed_fields = {
                  "question_id", "pronunciation_score",
                  "intonation_stress_score", "final_score"
              }
              normalized = {}
              for raw in questions:
                  if not isinstance(raw, dict):
                      raise ValueError("each question must be an object")
                  unknown = set(raw.keys()) - allowed_fields
                  missing = allowed_fields - set(raw.keys())
                  if unknown:
                      raise ValueError("unknown question fields: " + ", ".join(sorted(unknown)))
                  if missing:
                      raise ValueError("missing question fields: " + ", ".join(sorted(missing)))
                  question_id = str(raw.get("question_id") or "").strip().lower()
                  if question_id not in {"s_q1", "s_q2"}:
                      raise ValueError("question_id must be s_q1 or s_q2")
                  if question_id in normalized:
                      raise ValueError("duplicate question_id")
                  normalized[question_id] = {
                      "question_id": question_id,
                      "pronunciation_score": integer_score(
                          raw.get("pronunciation_score"), "pronunciation_score"
                      ),
                      "intonation_stress_score": integer_score(
                          raw.get("intonation_stress_score"), "intonation_stress_score"
                      ),
                      "final_score": integer_score(raw.get("final_score"), "final_score"),
                  }

              if set(normalized.keys()) != {"s_q1", "s_q2"}:
                  raise ValueError("questions must contain exactly one s_q1 and one s_q2")

              ordered = [normalized["s_q1"], normalized["s_q2"]]
              q1 = normalized["s_q1"]
              q2 = normalized["s_q2"]
              deterministic_score = SCORE_MATRIX[(q1["final_score"], q2["final_score"])]
              score_gap = abs(q1["final_score"] - q2["final_score"])
              repeated_pronunciation_weakness = (
                  q1["pronunciation_score"] <= 1 and q2["pronunciation_score"] <= 1
              )
              repeated_intonation_weakness = (
                  q1["intonation_stress_score"] <= 1
                  and q2["intonation_stress_score"] <= 1
              )
              policy_context = {
                  "questions": ordered,
                  "score_gap": score_gap,
                  "has_zero_question": any(item["final_score"] == 0 for item in ordered),
                  "repeated_pronunciation_weakness": repeated_pronunciation_weakness,
                  "repeated_intonation_weakness": repeated_intonation_weakness,
              }
              return {
                  "normalized_questions_json": json.dumps(ordered, ensure_ascii=False),
                  "policy_context_json": json.dumps(policy_context, ensure_ascii=False),
                  "deterministic_score": deterministic_score,
              }
        code_language: python3
        outputs:
          deterministic_score: {children: null, type: number}
          normalized_questions_json: {children: null, type: string}
          policy_context_json: {children: null, type: string}
        selected: false
        title: Validate and Prepare Group Input
        type: code
        variables:
        - value_selector: [rta-group-start, schema_version]
          value_type: string
          variable: schema_version
        - value_selector: [rta-group-start, job_id]
          value_type: string
          variable: job_id
        - value_selector: [rta-group-start, keycode]
          value_type: string
          variable: keycode
        - value_selector: [rta-group-start, group_code]
          value_type: string
          variable: group_code
        - value_selector: [rta-group-start, questions_json]
          value_type: string
          variable: questions_json
      height: 70
      id: rta-group-validate
      position: {x: 380, y: 330}
      positionAbsolute: {x: 380, y: 330}
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 300
      zIndex: 0
    - data:
        context:
          enabled: false
          variable_selector: []
        model:
          completion_params:
            json_schema: '{"type":"object","additionalProperties":false,"properties":{"group_final_score":{"type":"integer","enum":[0,1,2,3]}},"required":["group_final_score"]}'
            max_output_tokens: 500
            temperature: 0.0
            thinking_budget: 0
            thinking_mode: false
          mode: chat
          name: gemini-3.8-flash
          provider: langgenius/gemini/google
        prompt_template:
        - id: rta-group-system
          role: system
          text: |-
            You are the internal IIG Viet Nam aggregation assistant for TOEIC Speaking Part 1: Read a Text Aloud.

            This is an internal Q1-Q2 aggregation policy. ETS scores each response separately and does not publish an official Q1-Q2 group-score formula. Do not claim that this is an official ETS group score.

            INPUT CONTRACT
            You receive exactly two completed and locked question results: s_q1 and s_q2. Each question contains pronunciation_score, intonation_stress_score, and final_score, all integer values from 0 to 3.

            Do not modify the question scores. Do not request or infer audio, transcript, passage, errors, comments, evidence, or rationale. Do not calculate a TOEIC Speaking 0-200 score.

            GROUP SCORE POLICY
            Use the locked final_score values as the primary decision. Apply this symmetric matrix exactly:

            Q1/Q2  0  1  2  3
              0    0  0  1  1
              1    0  1  1  2
              2    1  1  2  2
              3    1  2  2  3

            Mandatory interpretations:
            - Equal question final scores produce the same group score.
            - Group score 3 is allowed only when both question final scores are 3.
            - If either question final score is 0, the group score must not exceed 1.
            - A one-level difference is resolved conservatively to the lower score.
            - A two-level difference resolves to the middle level.
            - The extreme pair 0 and 3 resolves to 1 because one invalid or missing response cannot be hidden by one excellent response.
            - Repeated pronunciation or intonation weakness may confirm a low result, but it must never override the matrix or increase the score.

            OUTPUT CONTRACT
            Return only group_final_score as an integer 0, 1, 2, or 3. Do not return rationale, confidence, review flags, markdown, comments, or any additional field.
        - id: rta-group-user
          role: user
          text: |-
            LOCKED QUESTION RESULTS:
            {{#rta-group-validate.normalized_questions_json#}}

            INTERNAL POLICY FACTS:
            {{#rta-group-validate.policy_context_json#}}

            Apply the matrix exactly and return the structured group score only.
        retry_config:
          max_retries: 3
          retry_enabled: true
          retry_interval: 1000
        selected: false
        structured_output:
          schema:
            type: object
            additionalProperties: false
            properties:
              group_final_score:
                type: integer
                enum: [0, 1, 2, 3]
            required:
            - group_final_score
        structured_output_enabled: true
        title: Adjudicate Q1-Q2 Group Score
        type: llm
        vision:
          configs:
            detail: high
            variable_selector: []
          enabled: false
      height: 118
      id: rta-group-llm
      position: {x: 750, y: 310}
      positionAbsolute: {x: 750, y: 310}
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 300
      zIndex: 0
    - data:
        code: |-
          import json

          def main(job_id, keycode, group_code, questions_json,
                   deterministic_score, llm_group_final_score) -> dict:
              expected = int(deterministic_score)
              proposed = int(llm_group_final_score)
              if expected < 0 or expected > 3:
                  raise ValueError("deterministic group score is invalid")
              if proposed < 0 or proposed > 3:
                  raise ValueError("LLM group score is invalid")

              # The deterministic policy is authoritative. A model disagreement is
              # corrected rather than persisted as an inconsistent group score.
              final_score = expected
              result = {
                  "schema_version": "rta-group-result-v1",
                  "group_code": group_code,
                  "group_final_score": final_score,
                  "versions": {
                      "group_prompt": "rta-group-prompt-v1",
                  },
              }
              return {
                  "group_final_score": final_score,
                  "result_json": json.dumps(result, ensure_ascii=False),
              }
        code_language: python3
        outputs:
          group_final_score: {children: null, type: number}
          result_json: {children: null, type: string}
        selected: false
        title: Enforce Group Policy and Build Result
        type: code
        variables:
        - value_selector: [rta-group-start, job_id]
          value_type: string
          variable: job_id
        - value_selector: [rta-group-start, keycode]
          value_type: string
          variable: keycode
        - value_selector: [rta-group-start, group_code]
          value_type: string
          variable: group_code
        - value_selector: [rta-group-validate, normalized_questions_json]
          value_type: string
          variable: questions_json
        - value_selector: [rta-group-validate, deterministic_score]
          value_type: number
          variable: deterministic_score
        - value_selector: [rta-group-llm, structured_output, group_final_score]
          value_type: number
          variable: llm_group_final_score
      height: 70
      id: rta-group-finalize
      position: {x: 1120, y: 330}
      positionAbsolute: {x: 1120, y: 330}
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 320
      zIndex: 0
    - data:
        outputs:
        - value_selector: [rta-group-finalize, group_final_score]
          value_type: number
          variable: group_final_score
        - value_selector: [rta-group-finalize, result_json]
          value_type: string
          variable: result_json
        selected: false
        title: RTA Group Result
        type: end
      height: 140
      id: rta-group-end
      position: {x: 1510, y: 310}
      positionAbsolute: {x: 1510, y: 310}
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 280
      zIndex: 0
    viewport:
      x: 0
      y: 0
      zoom: 0.8
  rag_pipeline_variables: []
