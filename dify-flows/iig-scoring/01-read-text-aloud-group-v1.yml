app:
  description: >-
    Aggregates the locked Q1 and Q2 Read Text Aloud question scores into one
    internal 0-3 group score. The LLM applies the published internal policy and
    a deterministic Code node validates the final result.
  icon: "🧮"
  icon_background: '#E4FBCC'
  icon_type: emoji
  mode: workflow
  name: IIG RTA Q1-Q2 Group Score v1
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/gemini:0.9.10@4979b8843fa46c3c2143d339f5868f04d9d77166616c00dd9f811a4adfce03ab
    version: null
kind: app
version: 0.7.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions: []
      allowed_file_types: []
      allowed_file_upload_methods: []
