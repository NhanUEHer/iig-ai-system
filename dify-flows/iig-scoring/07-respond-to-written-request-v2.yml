          import json, math
          KEYS=['task_fulfillment_score','sentence_quality_score','vocabulary_score','organization_score']
          def obj(v): return v if isinstance(v,dict) else json.loads(v or '{}')
          def b(v): return v if isinstance(v,bool) else str(v).lower() in {'true','1'}
          def main(job_id,question_id,score_output,deterministic_signals_json):
              r=obj(score_output); d=obj(deterministic_signals_json); s={k:max(0,min(4,int(r.get(k,0)))) for k in KEYS}; rules=[]
              sig={**d,'required_tasks_total':max(0,int(r.get('required_tasks_total',0))),'completed_tasks_count':max(0,int(r.get('completed_tasks_count',0))),'context_alignment_ratio':max(0,min(1,float(r.get('context_alignment_ratio',0)))),'source_context_summary':str(r.get('source_context_summary','')),'required_tasks_json':str(r.get('required_tasks_json','[]'))}
              for k in ['completely_off_topic','non_english','gibberish','copied_prompt_only','no_original_content','has_fragment','has_comma_splice','cut_off','lacks_sentence_variety','vocabulary_range_limited','organization_weak','informal_register']: sig[k]=b(r.get(k,False))
              sig['spelling_error_count']=max(0,int(r.get('spelling_error_count',0))); reason=None
              if sig['non_english']: reason='NON_ENGLISH_RESPONSE'
              elif sig['gibberish']: reason='GIBBERISH_RESPONSE'
              elif sig['copied_prompt_only']: reason='COPIED_PROMPT'
              elif sig['no_original_content'] or int(sig.get('response_word_count',0))<10: reason='NO_ORIGINAL_CONTENT'
              elif sig['completely_off_topic'] and sig['context_alignment_ratio']<0.5: reason='COMPLETELY_OFF_TOPIC'
              if reason: s={k:0 for k in KEYS}; final=0; rules=['BUSINESS_ZERO_'+reason]
              else:
                  s={k:max(1,v) for k,v in s.items()}; words=int(sig.get('response_word_count',0)); cap=4
                  if words<40: cap=1; rules.append('UNDER_40_WORDS_CAP')
                  elif words<60: cap=2; rules.append('UNDER_60_WORDS_CAP')
                  elif words<80: cap=3; rules.append('UNDER_80_WORDS_CAP')
                  missing=max(0,sig['required_tasks_total']-sig['completed_tasks_count'])
                  if missing>=2: s['task_fulfillment_score']=min(s['task_fulfillment_score'],2); rules.append('MULTIPLE_TASKS_MISSING_CAP')
                  elif missing==1: s['task_fulfillment_score']=min(s['task_fulfillment_score'],3); rules.append('ONE_TASK_MISSING_CAP')
                  if sig['has_fragment']: s['sentence_quality_score']=min(s['sentence_quality_score'],1); rules.append('FRAGMENT_CAP')
                  elif sig['has_comma_splice']: s['sentence_quality_score']=min(s['sentence_quality_score'],2); rules.append('COMMA_SPLICE_CAP')
                  if sig['cut_off']: s['sentence_quality_score']=min(s['sentence_quality_score'],2); rules.append('CUT_OFF_CAP')
                  if sig['lacks_sentence_variety']: s['sentence_quality_score']=min(s['sentence_quality_score'],3); rules.append('SENTENCE_VARIETY_CAP')
                  if sig['spelling_error_count']>3 or sig.get('all_caps'): s['vocabulary_score']=min(s['vocabulary_score'],2); rules.append('VOCABULARY_MECHANICS_CAP')
                  elif sig['spelling_error_count']>0: s['vocabulary_score']=min(s['vocabulary_score'],3); rules.append('SPELLING_CAP')
                  if sig['informal_register']: s['vocabulary_score']=min(s['vocabulary_score'],2); rules.append('REGISTER_CAP')
                  if sig['organization_weak']: s['organization_score']=min(s['organization_score'],2); rules.append('ORGANIZATION_CAP')
                  raw=sum(s.values())/4.0; final=min(cap,int(math.floor(raw+0.5)))
                  if s['task_fulfillment_score']<=1 or s['sentence_quality_score']<=1: final=min(final,2); rules.append('CRITICAL_COMPONENT_CAP')
                  elif min(s.values())<=2: final=min(final,3); rules.append('LIMITED_COMPONENT_FINAL_CAP')
              raw=round(sum(s.values())/4.0,4); data={'component_scores':{k[:-6]:v for k,v in s.items()},'question_score_raw':raw,'question_score_rounded':final,'zero_reason':reason,'rule_signals':sig,'applied_rules':list(dict.fromkeys(rules))}; event={'schema_version':'writing-progress-event-v1','event_type':'SCORE_READY','job_id':job_id,'question_id':question_id,'sequence':1,'data':data}
              return {**s,'question_score_raw':raw,'question_score_rounded':final,'zero_reason':reason or 'NONE','rule_signals_json':json.dumps(sig,ensure_ascii=False),'applied_rules_json':json.dumps(data['applied_rules'],ensure_ascii=False),'score_event_json':json.dumps(event,ensure_ascii=False)}
