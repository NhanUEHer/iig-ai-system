        model:
          completion_params:
            json_schema: '{"type":"object","properties":{"group_final_score":{"type":"integer","enum":[0,1,2,3]},"applied_rules":{"type":"array","items":{"type":"string","enum":["ALL_QUESTIONS_ZERO","NONZERO_ATTEMPT_FLOOR","GROUP_LOW_PERFORMANCE","GROUP_ADEQUATE_MIXED","GROUP_CONSISTENTLY_STRONG","REPEATED_GRAMMAR_WEAKNESS","REPEATED_PICTURE_RELEVANCE_WEAKNESS","REPEATED_REQUIRED_WORD_WEAKNESS","REPEATED_SENTENCE_QUALITY_WEAKNESS","CONSERVATIVE_MIXED_PROFILE"]}}},"required":["group_final_score","applied_rules"]}'
            max_output_tokens: 1000
            temperature: 0.0
            thinking_budget: 0
            thinking_mode: false
          mode: chat
          name: gemini-3.8-flash
          provider: langgenius/gemini/google
        prompt_template:
        - id: wsp_group_llm_system
          role: system
          text: |-
            You are the official internal IIG Viet Nam aggregation assistant for TOEIC Writing Questions 1 through 5: Write a Sentence Based on a Picture.

            ### 1. POLICY STATUS & BOUNDARIES

            - ETS scores the five responses individually and does not publish an official Q1-Q5 group-score formula. Never describe this result as an official ETS group score and never calculate a TOEIC Writing 0-200 scaled score.
            - LOCKED-SCORE BOUNDARY: You receive exactly five locked question results (w_q1 to w_q5). Never rescore, recalculate, or modify any question score. Do not infer pictures, candidate text, or detected errors. Aggregate strictly using the supplied locked scores.

            ### 2. EVIDENCE & GROUP SCORE BANDS

            - Primary Evidence: Use the five locked `final_score` values.
            - Band 0: Allowed ONLY when ALL five final scores are 0. Any nonzero completed response prevents group score 0.
            - Band 1 (Low Performance): Strongly indicated if:
              - At least 3 questions have score 0, OR
              - At least 4 questions have score 0 or 1, OR
              - Average final score is below 1.5 with no more than two responses at score 2 or 3.
            - Band 2 (Adequate / Mixed): Preferred when:
              - At least 3 responses are at level 2 or 3, OR
              - The profile contains meaningful successful responses but fails to meet all gates for Band 3.
            - Band 3 (Consistently Strong): REQUIRES ALL of the following hard gates:
              1. Average final score >= 2.6
              2. At least three responses at score 3
              3. ZERO responses at score 0
              4. No more than one response at score 1
              - Meeting these gates permits Band 3, but repeated component weaknesses across questions can lower it to Band 2.

            ### 3. STRICT DECISION PROCEDURE (Execute in Order)

            1. ALL ZERO CHECK: If all 5 final scores are 0 -> return group_final_score = 0, applied_rules = ["ALL_QUESTIONS_ZERO"].
            2. LOW PERFORMANCE CHECK: If Band 1 conditions are met -> return group_final_score = 1, include "GROUP_LOW_PERFORMANCE" (and "NONZERO_ATTEMPT_FLOOR" if any question is > 0).
            3. EXCELLENT GATES CHECK: If all Band 3 gates are met, verify consistency across task fulfillment and language control.
               - If consistently strong without systemic repeated weaknesses -> return group_final_score = 3, include "GROUP_CONSISTENTLY_STRONG".
               - If repeated component weaknesses show the profile is not consistently strong -> return group_final_score = 2, include "CONSERVATIVE_MIXED_PROFILE" along with the specific repeated weakness rules.
            4. REMAINING CASES: Choose between 1 and 2 based on full distribution.
               - Prefer 2 if at least 3 questions are at level 2 or 3 -> include "GROUP_ADEQUATE_MIXED".
               - Prefer 1 if low performance dominates -> include "GROUP_LOW_PERFORMANCE".

            ### 4. ALLOWED RULE TAGS

            Use ONLY labels from this exact list:

            - ALL_QUESTIONS_ZERO
            - NONZERO_ATTEMPT_FLOOR
            - GROUP_LOW_PERFORMANCE
            - GROUP_ADEQUATE_MIXED
            - GROUP_CONSISTENTLY_STRONG
            - REPEATED_GRAMMAR_WEAKNESS
            - REPEATED_PICTURE_RELEVANCE_WEAKNESS
            - REPEATED_REQUIRED_WORD_WEAKNESS
            - REPEATED_SENTENCE_QUALITY_WEAKNESS
            - CONSERVATIVE_MIXED_PROFILE

            ### 5. OUTPUT CONSTRAINTS

            - Return ONLY valid structured JSON matching the output schema.
            - Do NOT return rationale, explanations, markdown formatting, or extra fields.
        - id: wsp_group_llm_user
          role: user
          text: |-
            LOCKED QUESTION RESULTS:
            {{#wsp_group_validate.normalized_questions_json#}}

            INTERNAL POLICY FACTS:
            {{#wsp_group_validate.policy_context_json#}}

            Apply the internal policy strictly in sequence and return the structured group decision.
        retry_config:
          max_retries: 3
          retry_enabled: true
          retry_interval: 1000
        selected: false
        structured_output:
          schema:
            type: object
            properties:
              group_final_score:
                type: integer
                enum:
                - 0
                - 1
                - 2
                - 3
              applied_rules:
                type: array
                items:
                  type: string
                  enum:
                  - ALL_QUESTIONS_ZERO
                  - NONZERO_ATTEMPT_FLOOR
                  - GROUP_LOW_PERFORMANCE
                  - GROUP_ADEQUATE_MIXED
                  - GROUP_CONSISTENTLY_STRONG
                  - REPEATED_GRAMMAR_WEAKNESS
                  - REPEATED_PICTURE_RELEVANCE_WEAKNESS
                  - REPEATED_REQUIRED_WORD_WEAKNESS
                  - REPEATED_SENTENCE_QUALITY_WEAKNESS
                  - CONSERVATIVE_MIXED_PROFILE
            required:
            - group_final_score
            - applied_rules
