    - data:
        code: |-
          import math

          def main(relevance_score, grammar_score, keyword_score) -> dict:
              relevance = int(relevance_score)
              grammar = int(grammar_score)
              keyword = int(keyword_score)

              scores = [relevance, grammar, keyword]
              if any(score not in (0, 1, 2, 3) for score in scores):
                  raise ValueError("Component scores must be integers from 0 to 3")

              average = sum(scores) / 3
              final_score = math.floor(average + 0.5)

              return {
                  "relevance_score": relevance,
                  "grammar_score": grammar,
                  "keyword_score": keyword,
                  "final_score": final_score,
              }
        code_language: python3
        outputs:
          relevance_score:
            children:
            type: number
          grammar_score:
            children:
            type: number
          keyword_score:
            children:
            type: number
          final_score:
            children:
            type: number
        selected: false
