    - data:
        code: |-
          import math

          def main(quality_variety_score, vocabulary_score, organization_score) -> dict:
              quality_variety = int(quality_variety_score)
              vocabulary = int(vocabulary_score)
              organization = int(organization_score)

              scores = [quality_variety, vocabulary, organization]
              if any(score not in (0, 1, 2, 3, 4) for score in scores):
                  raise ValueError("Component scores must be integers from 0 to 4")

              average = sum(scores) / 3
              final_score = math.floor(average + 0.5)

              return {
                  "quality_variety_score": quality_variety,
                  "vocabulary_score": vocabulary,
                  "organization_score": organization,
                  "final_score": final_score,
              }
        code_language: python3
        outputs:
