    - data:
        code: |
          def main(schema_version, job_id, keycode, question_id, group_code,
                   ai_status, upstream_zero_reason, transcript) -> dict:
              errors = []
              reason = (upstream_zero_reason or "NONE").strip().upper()
              valid_reasons = {"NONE", "NO_SPEECH", "WRONG_LANGUAGE_VI", "WRONG_LANGUAGE_OTHER"}
              if schema_version != "describe-picture-question-input-v1": errors.append("schema_version must be describe-picture-question-input-v1")
              if not (job_id or "").strip(): errors.append("job_id is required")
              if not (keycode or "").strip(): errors.append("keycode is required")
              if question_id not in {"s_q3", "s_q4"}: errors.append("question_id must be s_q3 or s_q4")
              if group_code != "DESCRIBE_PICTURE": errors.append("group_code must be DESCRIBE_PICTURE")
              if reason not in valid_reasons: errors.append("invalid upstream_zero_reason")
              if errors:
                  route = "INVALID"
              elif reason != "NONE":
                  if ai_status != "ZERO_SCORE":
                      errors.append("upstream zero requires ai_status ZERO_SCORE")
                      route = "INVALID"
                  else: route = "UPSTREAM_ZERO"
              else:
                  if ai_status != "READY_FOR_AI": errors.append("normal scoring requires READY_FOR_AI")
                  if not (transcript or "").strip(): errors.append("transcript is required for normal scoring")
                  route = "NORMAL" if not errors else "INVALID"
              return {
                  "route": route, "validation_ok": route != "INVALID",
                  "validation_errors_json": __import__("json").dumps(errors, ensure_ascii=False),
                  "normalized_zero_reason": reason,
              }
        code_language: python3
        outputs:
          route:
            children:
            type: string
          validation_ok:
            children:
            type: boolean
          validation_errors_json:
            children:
            type: string
          normalized_zero_reason:
            children:
            type: string
