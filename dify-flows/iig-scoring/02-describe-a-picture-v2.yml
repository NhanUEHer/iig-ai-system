              "WRONG_LANGUAGE_VI": ("Bạn đã sử dụng tiếng Việt thay vì trả lời bằng tiếng Anh.", "Do câu trả lời không đáp ứng ngôn ngữ của bài thi, năm tiêu chí của câu này đều là 0.", "Bạn cần mô tả bức tranh hoàn toàn bằng tiếng Anh trong lần tiếp theo."),
              "WRONG_LANGUAGE_OTHER": ("Câu trả lời không sử dụng tiếng Anh theo yêu cầu của bài thi.", "Do không đủ dữ liệu tiếng Anh để đánh giá, năm tiêu chí của câu này đều là 0.", "Bạn cần mô tả bức tranh hoàn toàn bằng tiếng Anh trong lần tiếp theo."),
              "WRONG_PICTURE": ("Nội dung trả lời không mô tả bức tranh được cung cấp.", "Do câu trả lời không khớp với tranh, năm tiêu chí của câu này đều là 0.", "Bạn nên xác định chủ thể, hành động và bối cảnh nổi bật trước khi bắt đầu nói."),
          }
          def main(job_id, keycode, question_id, group_code, zero_reason, score_event_json=None) -> dict:
              reason = zero_reason if zero_reason in COMMENTS else "NO_SPEECH"
