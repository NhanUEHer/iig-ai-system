    - data:
        code: |
          import json, math
          def clamp(value): return max(0, min(3, int(value)))
          def main(job_id, question_id, pronunciation_score, intonation_fluency_score,
                   grammar_score, vocabulary_score, cohesion_score, scene_alignment_ratio,
                   content_coverage_ratio, response_word_count, effective_speaking_seconds,
                   subject_count_band, central_subject_covered, secondary_subjects_covered,
                   main_action_covered, cut_off, excessive_fillers, wrong_picture,
                   inanimate_action_error) -> dict:
              scores = {
                  "pronunciation_score": clamp(pronunciation_score),
                  "intonation_fluency_score": clamp(intonation_fluency_score),
                  "grammar_score": clamp(grammar_score), "vocabulary_score": clamp(vocabulary_score),
                  "cohesion_score": clamp(cohesion_score),
              }
              alignment = max(0.0, min(1.0, float(scene_alignment_ratio)))
              coverage = max(0.0, min(1.0, float(content_coverage_ratio)))
              applied = []
              zero_reason = "WRONG_PICTURE" if bool(wrong_picture) and alignment < 0.50 else "NONE"
              if zero_reason != "NONE":
                  for key in scores: scores[key] = 0
                  applied.append("WRONG_PICTURE_ZERO")
              else:
                  for key in scores: scores[key] = max(1, scores[key])
                  words, seconds = int(response_word_count), float(effective_speaking_seconds)
                  if words < 8 or seconds < 6:
                      scores["pronunciation_score"] = min(scores["pronunciation_score"], 2)
                      scores["intonation_fluency_score"] = min(scores["intonation_fluency_score"], 2)
                      for key in ("grammar_score", "vocabulary_score", "cohesion_score"): scores[key] = min(scores[key], 1)
                      applied.append("SEVERELY_SHORT_RESPONSE_CAP")
                  elif words < 15 or seconds < 10:
                      scores["intonation_fluency_score"] = min(scores["intonation_fluency_score"], 2)
                      scores["vocabulary_score"] = min(scores["vocabulary_score"], 2)
                      scores["cohesion_score"] = min(scores["cohesion_score"], 2)
                      applied.append("SHORT_RESPONSE_CAP")
                  if coverage < 0.35:
                      scores["vocabulary_score"] = min(scores["vocabulary_score"], 1); scores["cohesion_score"] = min(scores["cohesion_score"], 1); applied.append("LOW_CONTENT_COVERAGE_CAP")
                  elif coverage < 0.60:
                      scores["vocabulary_score"] = min(scores["vocabulary_score"], 2); scores["cohesion_score"] = min(scores["cohesion_score"], 2); applied.append("PARTIAL_CONTENT_COVERAGE_CAP")
                  band = str(subject_count_band)
                  if band == "ONE" and (not central_subject_covered or not main_action_covered):
                      scores["vocabulary_score"] = min(scores["vocabulary_score"], 1); scores["cohesion_score"] = min(scores["cohesion_score"], 1); applied.append("CENTRAL_SUBJECT_OR_ACTION_MISSING")
                  elif band in {"TWO", "THREE_PLUS"} and not secondary_subjects_covered:
                      scores["vocabulary_score"] = min(scores["vocabulary_score"], 2); scores["cohesion_score"] = min(scores["cohesion_score"], 2); applied.append("SECONDARY_SUBJECTS_MISSING")
                  if bool(cut_off): scores["cohesion_score"] = max(1, scores["cohesion_score"] - 1); applied.append("CUT_OFF_PENALTY")
                  if bool(excessive_fillers): scores["intonation_fluency_score"] = max(1, scores["intonation_fluency_score"] - 1); applied.append("EXCESSIVE_FILLERS_PENALTY")
                  if bool(inanimate_action_error):
                      scores["grammar_score"] = max(1, scores["grammar_score"] - 1); scores["vocabulary_score"] = max(1, scores["vocabulary_score"] - 1); applied.append("INANIMATE_ACTION_PENALTY")
                  # Score 3 means strong performance across all five dimensions, not one isolated strength.
                  if sum(scores.values()) >= 13 and (min(scores.values()) < 2 or alignment < 0.75 or coverage < 0.70):
                      while sum(scores.values()) > 12:
                          key = max(scores, key=scores.get); scores[key] = max(1, scores[key] - 1)
                      applied.append("EXCELLENT_ELIGIBILITY_CAP")
              raw = sum(scores.values()) / 5.0
              rounded = math.floor(raw + 0.5)
              signals = {"scene_alignment_ratio": round(alignment, 4), "content_coverage_ratio": round(coverage, 4), "response_word_count": int(response_word_count), "effective_speaking_seconds": float(effective_speaking_seconds), "subject_count_band": str(subject_count_band), "central_subject_covered": bool(central_subject_covered), "secondary_subjects_covered": bool(secondary_subjects_covered), "main_action_covered": bool(main_action_covered), "cut_off": bool(cut_off), "excessive_fillers": bool(excessive_fillers), "wrong_picture": zero_reason == "WRONG_PICTURE", "inanimate_action_error": bool(inanimate_action_error)}
              data = {**scores, "question_score_raw": raw, "question_score_rounded": rounded, "zero_reason": zero_reason, "rule_signals": signals, "applied_rules": applied}
              event = {"schema_version": "describe-picture-progress-event-v1", "event_type": "SCORE_READY", "job_id": job_id, "question_id": question_id, "sequence": 1, "data": data}
              return {**scores, "question_score_raw": raw, "question_score_rounded": rounded, "zero_reason": zero_reason, "scene_alignment_ratio": alignment, "content_coverage_ratio": coverage, "rule_signals_json": json.dumps(signals, ensure_ascii=False), "applied_rules_json": json.dumps(applied, ensure_ascii=False), "score_event_json": json.dumps(event, ensure_ascii=False)}
