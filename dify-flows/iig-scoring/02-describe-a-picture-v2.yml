    - data:
        code: |-
          import json

          def main(job_id, question_id, validation_errors_json) -> dict:
              try:
                  errors = json.loads(validation_errors_json or "[]")
              except Exception:
                  errors = ["invalid input"]
              result = {
                  "schema_version": "describe-picture-question-result-v1",
                  "job_id": job_id,
                  "question_id": question_id,
                  "status": "FAILED",
                  "failure_code": "INVALID_INPUT",
                  "failure_details": errors,
              }
              return {
                  "status": "FAILED",
                  "failure_code": "INVALID_INPUT",
                  "failure_details_json": json.dumps(errors, ensure_ascii=False),
                  "result_json": json.dumps(result, ensure_ascii=False),
