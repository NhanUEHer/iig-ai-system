    - data:
        code: |
          import json, re
          def one_sentence(value, fallback):
              text = " ".join(str(value or "").split()).strip() or fallback
              chunks = [part.strip() for part in re.split(r"(?<=[.!?])\s+", text) if part.strip()]
              text = chunks[0] if chunks else fallback
              if text[-1:] not in ".!?”": text += "."
              return text[:360]
          def main(job_id, keycode, question_id, group_code, pronunciation_score,
                   intonation_fluency_score, grammar_score, vocabulary_score, cohesion_score,
                   question_score_raw, question_score_rounded, rule_signals_json,
                   applied_rules_json, score_event_json, errors_json, errors_event_json,
                   comment_output) -> dict:
              output = comment_output if isinstance(comment_output, dict) else {}
              strength = one_sentence(output.get("strength"), "Bạn đã tạo được phần mô tả có thể đánh giá cho bức tranh.")
              improvement = one_sentence(output.get("improvement"), "Bạn cần làm rõ hơn nội dung trung tâm và cách tổ chức phần mô tả.")
              action = one_sentence(output.get("action"), "Hãy luyện theo thứ tự tổng quan, chủ thể chính, hành động và chi tiết hỗ trợ.")
              comment = {"strength": strength, "improvement": improvement, "action": action, "text": " ".join([strength, improvement, action])}
              try: errors = json.loads(errors_json or "[]")
              except Exception: errors = []
              try: signals = json.loads(rule_signals_json or "{}")
              except Exception: signals = {}
              try: rules = json.loads(applied_rules_json or "[]")
              except Exception: rules = []
              result = {"schema_version": "describe-picture-question-result-v1", "job_id": job_id, "keycode": keycode, "question_id": question_id, "group_code": group_code, "status": "COMPLETED", "pronunciation_score": int(pronunciation_score), "intonation_fluency_score": int(intonation_fluency_score), "grammar_score": int(grammar_score), "vocabulary_score": int(vocabulary_score), "cohesion_score": int(cohesion_score), "question_score_raw": float(question_score_raw), "question_score_rounded": int(question_score_rounded), "zero_reason": None, "rule_signals": signals, "applied_rules": rules, "errors": errors, "comment": comment, "versions": {"rubric_version": "describe-picture-q3-q4-rubric-v1", "score_prompt_version": "describe-picture-score-v1", "error_prompt_version": "describe-picture-error-v3", "comment_prompt_version": "describe-picture-comment-v1"}}
              envelope = lambda event_type, sequence, data: json.dumps({"schema_version": "describe-picture-progress-event-v1", "event_type": event_type, "job_id": job_id, "question_id": question_id, "sequence": sequence, "data": data}, ensure_ascii=False)
              return {"pronunciation_score": int(pronunciation_score), "intonation_fluency_score": int(intonation_fluency_score), "grammar_score": int(grammar_score), "vocabulary_score": int(vocabulary_score), "cohesion_score": int(cohesion_score), "question_score_raw": float(question_score_raw), "question_score_rounded": int(question_score_rounded), "zero_reason": "NONE", "errors_json": json.dumps(errors, ensure_ascii=False), "comment_strength": strength, "comment_improvement": improvement, "comment_action": action, "comment_text": comment["text"], "score_event_json": score_event_json, "errors_event_json": errors_event_json, "comment_event_json": envelope("COMMENT_READY", 3, comment), "completed_event_json": envelope("QUESTION_COMPLETED", 4, result), "result_json": json.dumps(result, ensure_ascii=False)}
