            Analyze errors for one TOEIC Speaking Describe a Picture response. Scores are locked; never rescore.
            Use the official picture as the only source of truth for visible content, transcript for linguistic evidence, and audio for pronunciation/delivery. Do not invent objects, actions, locations, or word-level evidence.

            Use only: PRONUNCIATION, INTONATION_FLUENCY, GRAMMAR, VOCABULARY, COHESION, PICTURE_CONTENT.
