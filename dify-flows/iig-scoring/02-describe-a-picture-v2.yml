    - data:
        code: |
          import json
          ALLOWED = ["PRONUNCIATION", "INTONATION_FLUENCY", "GRAMMAR", "VOCABULARY", "COHESION", "PICTURE_CONTENT"]
          RANK = {"LOW": 1, "MEDIUM": 2, "HIGH": 3}
          PRIORITY = {"PICTURE_CONTENT": 6, "COHESION": 5, "GRAMMAR": 4, "VOCABULARY": 3, "INTONATION_FLUENCY": 2, "PRONUNCIATION": 1}
          def clean(value, limit): return " ".join(str(value or "").split())[:limit]
          def main(job_id, question_id, error_output, pronunciation_score, intonation_fluency_score, grammar_score, vocabulary_score, cohesion_score, rule_signals_json, applied_rules_json) -> dict:
              raw = (error_output or {}).get("errors", []) if isinstance(error_output, dict) else []
              scores = {"PRONUNCIATION": int(pronunciation_score), "INTONATION_FLUENCY": int(intonation_fluency_score), "GRAMMAR": int(grammar_score), "VOCABULARY": int(vocabulary_score), "COHESION": int(cohesion_score)}
              try: signals = json.loads(rule_signals_json or "{}")
              except Exception: signals = {}
              try: rules = set(json.loads(applied_rules_json or "[]"))
              except Exception: rules = set()
              normalized = []
              by_exact_key = {}
              def append_unique(candidate):
                  key = (candidate["error_type"], clean(candidate["evidence"], 120).lower(), clean(candidate["message_vi"], 280).lower())
                  existing = by_exact_key.get(key)
                  if existing:
                      existing["count"] = max(existing["count"], candidate["count"])
                      if RANK[candidate["severity"]] > RANK[existing["severity"]]: existing["severity"] = candidate["severity"]
                      return
                  by_exact_key[key] = candidate
                  normalized.append(candidate)
              for item in raw:
                  if not isinstance(item, dict): continue
                  kind, severity = str(item.get("error_type", "")).upper(), str(item.get("severity", "")).upper()
                  if kind not in ALLOWED or severity not in RANK: continue
                  if scores.get(kind) == 3 and severity == "HIGH": severity = "MEDIUM"
                  candidate = {"error_type": kind, "severity": severity, "count": max(1, min(99, int(item.get("count", 1)))), "evidence": clean(item.get("evidence"), 120), "message_vi": clean(item.get("message_vi"), 280)}
                  if not candidate["message_vi"]: continue
                  append_unique(candidate)
              def ensure(kind, severity, evidence, message):
                  append_unique({"error_type": kind, "severity": severity, "count": 1, "evidence": evidence, "message_vi": message})
              if "EXCESSIVE_FILLERS_PENALTY" in rules or signals.get("excessive_fillers"):
                  ensure("INTONATION_FLUENCY", "MEDIUM", "Có nhiều từ đệm hoặc nhịp nói bị gián đoạn", "Bài nói có nhiều từ đệm hoặc khoảng ngắt làm giảm độ trôi chảy.")
              if "CUT_OFF_PENALTY" in rules or signals.get("cut_off"):
                  ensure("COHESION", "MEDIUM", "Phần kết thúc bị ngắt", "Bài mô tả kết thúc chưa trọn ý nên mạch nội dung chưa hoàn chỉnh.")
              if "INANIMATE_ACTION_PENALTY" in rules or signals.get("inanimate_action_error"):
                  ensure("PICTURE_CONTENT", "MEDIUM", "Hành động không phù hợp với chủ thể hoặc vật thể", "Bài mô tả gán một hành động không phù hợp cho chủ thể hoặc vật thể trong tranh.")
              if rules.intersection({"LOW_CONTENT_COVERAGE_CAP", "PARTIAL_CONTENT_COVERAGE_CAP", "CENTRAL_SUBJECT_OR_ACTION_MISSING", "SECONDARY_SUBJECTS_MISSING"}):
                  ensure("PICTURE_CONTENT", "MEDIUM", "Nội dung chính hoặc chi tiết hỗ trợ chưa được bao quát", "Bài nói chưa bao quát đầy đủ chủ thể, hành động hoặc chi tiết quan trọng trong tranh.")
              if rules.intersection({"SEVERELY_SHORT_RESPONSE_CAP", "SHORT_RESPONSE_CAP"}):
                  ensure("COHESION", "MEDIUM", "Phần mô tả quá ngắn để phát triển đầy đủ", "Bài nói quá ngắn nên nội dung và bố cục chưa được phát triển đầy đủ.")
              normalized = sorted(normalized, key=lambda item: (-RANK[item["severity"]], -PRIORITY[item["error_type"]]))
              counts, highest = {}, {}
              for item in normalized:
                  kind = item["error_type"]
                  counts[kind] = counts.get(kind, 0) + item["count"]
                  if kind not in highest or RANK[item["severity"]] > RANK[highest[kind]]: highest[kind] = item["severity"]
              summary = "; ".join([f'{kind}:{highest[kind]}({counts[kind]})' for kind in ALLOWED if kind in counts]) or "NONE"
              data = {"errors": normalized, "error_counts": counts, "summary": summary}
              event = {"schema_version": "describe-picture-progress-event-v1", "event_type": "ERRORS_READY", "job_id": job_id, "question_id": question_id, "sequence": 2, "data": data}
              return {"errors_json": json.dumps(normalized, ensure_ascii=False), "error_counts_json": json.dumps(counts, ensure_ascii=False), "error_summary": summary, "errors_event_json": json.dumps(event, ensure_ascii=False)}
        code_language: python3
        outputs:
          errors_json:
            children:
            type: string
          error_counts_json:
            children:
            type: string
          error_summary:
            children:
            type: string
          errors_event_json:
            children:
            type: string
