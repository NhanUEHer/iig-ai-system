    - data:
        code: |
          import json
          COMMENTS = {
              "NO_SPEECH": ("Không phát hiện phần trả lời có giọng nói trong bài làm của bạn.", "Vì không có dữ liệu lời nói để đánh giá, năm tiêu chí của câu này đều là 0.", "Bạn cần kiểm tra micro và mô tả các đối tượng, hành động và bối cảnh chính trong tranh."),
              "WRONG_LANGUAGE_VI": ("Bạn đã sử dụng tiếng Việt thay vì trả lời bằng tiếng Anh.", "Do câu trả lời không đáp ứng ngôn ngữ của bài thi, năm tiêu chí của câu này đều là 0.", "Bạn cần mô tả bức tranh hoàn toàn bằng tiếng Anh trong lần tiếp theo."),
              "WRONG_LANGUAGE_OTHER": ("Câu trả lời không sử dụng tiếng Anh theo yêu cầu của bài thi.", "Do không đủ dữ liệu tiếng Anh để đánh giá, năm tiêu chí của câu này đều là 0.", "Bạn cần mô tả bức tranh hoàn toàn bằng tiếng Anh trong lần tiếp theo."),
              "WRONG_PICTURE": ("Nội dung trả lời không mô tả bức tranh được cung cấp.", "Do câu trả lời không khớp với tranh, năm tiêu chí của câu này đều là 0.", "Bạn nên xác định chủ thể, hành động và bối cảnh nổi bật trước khi bắt đầu nói."),
          }
          def main(job_id, keycode, question_id, group_code, zero_reason, score_event_json=None) -> dict:
              reason = zero_reason if zero_reason in COMMENTS else "NO_SPEECH"
              s1, s2, s3 = COMMENTS[reason]
              errors = [{"error_type": "PICTURE_CONTENT", "severity": "HIGH", "count": 1, "evidence": reason, "message_vi": s1}]
              scores = {"pronunciation_score": 0, "intonation_fluency_score": 0, "grammar_score": 0, "vocabulary_score": 0, "cohesion_score": 0, "question_score_raw": 0.0, "question_score_rounded": 0, "zero_reason": reason}
              comment = {"strength": s1, "improvement": s2, "action": s3, "text": " ".join([s1, s2, s3])}
              result = {"schema_version": "describe-picture-question-result-v1", "job_id": job_id, "keycode": keycode, "question_id": question_id, "group_code": group_code, "status": "COMPLETED", **scores, "rule_signals": {}, "applied_rules": ["BUSINESS_ZERO_" + reason], "errors": errors, "comment": comment, "versions": {"rubric_version": "describe-picture-q3-q4-rubric-v1", "score_prompt_version": "deterministic-zero-v1", "error_prompt_version": "deterministic-zero-v1", "comment_prompt_version": "deterministic-zero-v1"}}
              envelope = lambda event_type, sequence, data: json.dumps({"schema_version": "describe-picture-progress-event-v1", "event_type": event_type, "job_id": job_id, "question_id": question_id, "sequence": sequence, "data": data}, ensure_ascii=False)
              return {**scores, "errors_json": json.dumps(errors, ensure_ascii=False), "comment_strength": s1, "comment_improvement": s2, "comment_action": s3, "comment_text": comment["text"], "score_event_json": score_event_json or envelope("SCORE_READY", 1, scores), "errors_event_json": envelope("ERRORS_READY", 2, {"errors": errors}), "comment_event_json": envelope("COMMENT_READY", 3, comment), "completed_event_json": envelope("QUESTION_COMPLETED", 4, result), "result_json": json.dumps(result, ensure_ascii=False)}
        code_language: python3
