    - data:
        code: |-
          import math
          import re

          def main(support_score, grammar_score, vocabulary_score, organization_score, student_writing) -> dict:
              support = int(support_score)
              grammar = int(grammar_score)
              vocabulary = int(vocabulary_score)
              organization = int(organization_score)

              scores = [support, grammar, vocabulary, organization]
              if any(score not in (0, 1, 2, 3, 4, 5) for score in scores):
                  raise ValueError("Component scores must be integers from 0 to 5")

              average = sum(scores) / 4
              final_score = math.floor(average + 0.5)
              word_count = len(re.findall(r"\b[\w']+\b", str(student_writing or ""), flags=re.UNICODE))

              if word_count < 40:
                  final_score = 0
              elif word_count < 100:
                  final_score = min(final_score, 1)
              elif word_count < 200:
                  final_score = min(final_score, 2)
              elif word_count < 250:
                  final_score = min(final_score, 3)
              elif word_count < 300:
                  final_score = min(final_score, 4)

              if support <= 2 or grammar <= 2:
                  final_score = min(final_score, 2)

              return {
                  "support_score": support,
                  "grammar_score": grammar,
                  "vocabulary_score": vocabulary,
                  "organization_score": organization,
                  "final_score": final_score,
              }
        code_language: python3
