    - data:
        code: |-
          import json

          COMPONENTS = [
              "grammar_score",
              "picture_relevance_score",
              "required_word_usage_score",
              "sentence_quality_score",
          ]
          WEAKNESS_RULES = {
              "grammar_score": "REPEATED_GRAMMAR_WEAKNESS",
              "picture_relevance_score": "REPEATED_PICTURE_RELEVANCE_WEAKNESS",
              "required_word_usage_score": "REPEATED_REQUIRED_WORD_WEAKNESS",
              "sentence_quality_score": "REPEATED_SENTENCE_QUALITY_WEAKNESS",
          }

          def main(job_id, keycode, group_code, questions_json,
                   llm_group_final_score, llm_applied_rules) -> dict:
              questions = json.loads(questions_json)
              if not isinstance(questions, list) or len(questions) != 5:
                  raise ValueError("exactly five normalized questions are required")

              try:
                  proposed = int(llm_group_final_score)
              except (TypeError, ValueError):
                  raise ValueError("LLM group score must be an integer from 0 to 3")
              if proposed < 0 or proposed > 3:
                  raise ValueError("LLM group score must be an integer from 0 to 3")

              raw_rules = llm_applied_rules or []
              if not isinstance(raw_rules, list):
                  raise ValueError("applied_rules must be an array")
              # LLM rule tags are advisory only. The authoritative rule list is rebuilt
              # below from the locked question scores and deterministic thresholds.

              finals = [int(question["final_score"]) for question in questions]
              raw_total = sum(finals)
              average = round(raw_total / 5.0, 3)
              zero_count = sum(value == 0 for value in finals)
              score_1_count = sum(value == 1 for value in finals)
              score_3_count = sum(value == 3 for value in finals)
              low_count = sum(value <= 1 for value in finals)
              strong_count = sum(value >= 2 for value in finals)

              repeated_weakness_rules = []
              for field in COMPONENTS:
                  values = [int(question[field]) for question in questions]
                  severe_count = sum(value <= 1 for value in values)
                  below_strong_count = sum(value <= 2 for value in values)
                  if severe_count >= 2 or below_strong_count >= 3:
                      repeated_weakness_rules.append(WEAKNESS_RULES[field])

              all_questions_zero = zero_count == 5
              low_performance_cap = (
                  zero_count >= 3
                  or low_count >= 4
                  or (average < 1.5 and strong_count <= 2)
              )
              adequate_majority_floor = strong_count >= 3 and zero_count <= 2
              excellent_score_gate = (
                  average >= 2.6
                  and score_3_count >= 3
                  and zero_count == 0
                  and score_1_count <= 1
              )
              excellent_eligible = excellent_score_gate and not repeated_weakness_rules

              if all_questions_zero:
                  final_score = 0
                  rules = ["ALL_QUESTIONS_ZERO"]
              elif low_performance_cap:
                  final_score = 1
                  rules = ["NONZERO_ATTEMPT_FLOOR", "GROUP_LOW_PERFORMANCE"]
              elif excellent_eligible:
                  final_score = 3
                  rules = ["GROUP_CONSISTENTLY_STRONG"]
              elif adequate_majority_floor:
                  final_score = 2
                  rules = ["GROUP_ADEQUATE_MIXED", *repeated_weakness_rules]
                  if excellent_score_gate and repeated_weakness_rules:
                      rules.append("CONSERVATIVE_MIXED_PROFILE")
              else:
                  final_score = 1
                  rules = ["NONZERO_ATTEMPT_FLOOR", "GROUP_LOW_PERFORMANCE"]

              # The LLM is an adjudication layer, while this node remains the authority
              # for all numeric boundaries and repeated-weakness thresholds.

              result = {
                  "schema_version": "write-sentence-group-result-v1",
                  "job_id": job_id,
                  "keycode": keycode,
                  "group_code": group_code,
                  "status": "COMPLETED",
                  "group_final_score": final_score,
                  "group_raw_total": raw_total,
                  "group_score_max": 15,
                  "group_average": average,
                  "question_scores": finals,
                  "applied_rules": list(dict.fromkeys(rules)),
                  "versions": {
                      "group_prompt_version": "write-sentence-group-prompt-v2",
                      "group_policy_version": "write-sentence-group-policy-v2",
                  },
              }
              return {
                  "group_final_score": final_score,
                  "group_raw_total": raw_total,
                  "group_average": average,
                  "result_json": json.dumps(result, ensure_ascii=False),
              }
        code_language: python3
        outputs:
          group_final_score:
            children:
            type: number
          group_raw_total:
            children:
            type: number
          group_average:
            children:
            type: number
          result_json:
            children:
            type: string
