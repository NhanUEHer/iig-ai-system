    - data:
        code: |-
          import json

          COMPONENTS = [
              "grammar_score",
              "picture_relevance_score",
              "required_word_usage_score",
              "sentence_quality_score",
          ]
          SCORES = COMPONENTS + ["final_score"]
          ALLOWED = {"question_id", "question_number", *SCORES}

          def integer_score(value, field):
              if isinstance(value, bool):
                  raise ValueError(field + " must be an integer from 0 to 3")
              try:
                  number = int(value)
              except (TypeError, ValueError):
                  raise ValueError(field + " must be an integer from 0 to 3")
              if number < 0 or number > 3:
                  raise ValueError(field + " must be an integer from 0 to 3")
              if str(value).strip() not in {str(number), str(float(number))}:
                  raise ValueError(field + " must be an integer from 0 to 3")
              return number

          def main(schema_version, job_id, keycode, group_code, questions_json) -> dict:
              if schema_version != "write-sentence-group-input-v1":
                  raise ValueError("schema_version must be write-sentence-group-input-v1")
              if not str(job_id or "").strip() or not str(keycode or "").strip():
                  raise ValueError("job_id and keycode are required")
              if group_code != "WRITE_SENTENCE_PICTURE":
                  raise ValueError("group_code must be WRITE_SENTENCE_PICTURE")

              try:
                  raw_questions = json.loads(questions_json)
              except Exception as error:
                  raise ValueError("questions_json must be valid JSON") from error
              if not isinstance(raw_questions, list) or len(raw_questions) != 5:
                  raise ValueError("questions_json must contain exactly five questions")

              normalized = []
              for index, raw in enumerate(raw_questions):
                  number = index + 1
                  expected_id = f"w_q{number}"
                  if not isinstance(raw, dict):
                      raise ValueError("each question must be an object")
                  unknown = set(raw.keys()) - ALLOWED
                  missing = ALLOWED - set(raw.keys())
                  if unknown:
                      raise ValueError("unknown question fields: " + ", ".join(sorted(unknown)))
                  if missing:
                      raise ValueError("missing question fields: " + ", ".join(sorted(missing)))
                  if str(raw.get("question_id") or "").strip().lower() != expected_id:
                      raise ValueError("questions must be ordered w_q1 through w_q5")
                  try:
                      supplied_number = int(raw.get("question_number"))
                  except (TypeError, ValueError):
                      raise ValueError(expected_id + ".question_number is invalid")
                  if supplied_number != number:
                      raise ValueError("questions must be ordered w_q1 through w_q5")
                  item = {"question_id": expected_id, "question_number": number}
                  for field in SCORES:
                      item[field] = integer_score(raw.get(field), expected_id + "." + field)
                  normalized.append(item)

              finals = [question["final_score"] for question in normalized]
              ordered = sorted(finals)
              raw_total = sum(finals)
              average = round(raw_total / 5.0, 3)
              zero_count = sum(value == 0 for value in finals)
              score_1_count = sum(value == 1 for value in finals)
              score_2_count = sum(value == 2 for value in finals)
              score_3_count = sum(value == 3 for value in finals)
              low_count = sum(value <= 1 for value in finals)
              strong_count = sum(value >= 2 for value in finals)

              component_profiles = {}
              repeated_weakness_rules = []
              weakness_rule_by_component = {
                  "grammar_score": "REPEATED_GRAMMAR_WEAKNESS",
                  "picture_relevance_score": "REPEATED_PICTURE_RELEVANCE_WEAKNESS",
                  "required_word_usage_score": "REPEATED_REQUIRED_WORD_WEAKNESS",
                  "sentence_quality_score": "REPEATED_SENTENCE_QUALITY_WEAKNESS",
              }
              for field in COMPONENTS:
                  values = [question[field] for question in normalized]
                  severe_count = sum(value <= 1 for value in values)
                  below_strong_count = sum(value <= 2 for value in values)
                  repeated = severe_count >= 2 or below_strong_count >= 3
                  component_profiles[field] = {
                      "scores": values,
                      "average": round(sum(values) / 5.0, 3),
                      "severe_count": severe_count,
                      "below_strong_count": below_strong_count,
                      "repeated_weakness": repeated,
                  }
                  if repeated:
                      repeated_weakness_rules.append(weakness_rule_by_component[field])

              question_profiles = []
              for question in normalized:
                  weak_components = [
                      field for field in COMPONENTS if question[field] <= 1
                  ]
                  limited_components = [
                      field for field in COMPONENTS if question[field] == 2
                  ]
                  question_profiles.append({
                      "question_id": question["question_id"],
                      "final_score": question["final_score"],
                      "weak_components": weak_components,
                      "limited_components": limited_components,
                  })

              all_questions_zero = zero_count == 5
              low_performance_cap = (
                  zero_count >= 3
                  or low_count >= 4
                  or (average < 1.5 and strong_count <= 2)
              )
              adequate_majority_floor = strong_count >= 3 and zero_count <= 2
              excellent_score_gate = (
                  average >= 2.6
                  and score_3_count >= 3
                  and zero_count == 0
                  and score_1_count <= 1
              )
              excellent_eligible = excellent_score_gate and not repeated_weakness_rules

              if all_questions_zero:
                  deterministic_recommended_band = 0
              elif low_performance_cap:
                  deterministic_recommended_band = 1
              elif excellent_eligible:
                  deterministic_recommended_band = 3
              elif adequate_majority_floor:
                  deterministic_recommended_band = 2
              else:
                  deterministic_recommended_band = 1

              facts = {
                  "question_finals": finals,
                  "question_profiles": question_profiles,
                  "raw_total": raw_total,
                  "score_max": 15,
                  "average_final": average,
                  "median_final": ordered[2],
                  "zero_count": zero_count,
                  "score_1_count": score_1_count,
                  "score_2_count": score_2_count,
                  "score_3_count": score_3_count,
                  "low_question_count": low_count,
                  "strong_question_count": strong_count,
                  "component_profiles": component_profiles,
                  "repeated_weakness_rules": repeated_weakness_rules,
                  "all_questions_zero": all_questions_zero,
                  "low_performance_cap": low_performance_cap,
                  "adequate_majority_floor": adequate_majority_floor,
                  "excellent_score_gate": excellent_score_gate,
                  "excellent_eligible": excellent_eligible,
                  "deterministic_recommended_band": deterministic_recommended_band,
              }
              return {
                  "normalized_questions_json": json.dumps(normalized, ensure_ascii=False),
                  "policy_context_json": json.dumps(facts, ensure_ascii=False),
              }
        code_language: python3
        outputs:
          normalized_questions_json:
            children:
            type: string
          policy_context_json:
            children:
            type: string
