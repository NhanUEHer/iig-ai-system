    - data:
        code: |-
          import json

          ALLOWED_STATUSES = {
              "SUCCESS", "NO_SPEECH", "WRONG_LANGUAGE_VI",
              "WRONG_LANGUAGE_OTHER", "UNINTELLIGIBLE", "FAILED",
          }

          def as_bool(value):
              if isinstance(value, bool):
                  return value
              if isinstance(value, str):
                  normalized = value.strip().lower()
                  if normalized == "true":
                      return True
                  if normalized == "false":
                      return False
              return False

          def main(stt_result) -> dict:
              value = stt_result
              if isinstance(value, str):
                  try:
                      value = json.loads(value)
                  except Exception:
                      value = {}
              if not isinstance(value, dict):
                  value = {}

              status = str(value.get("status") or "FAILED").strip().upper()
              if status not in ALLOWED_STATUSES:
                  status = "FAILED"
              transcript = str(value.get("transcript") or "").strip()
              speech_detected = as_bool(value.get("speech_detected"))
              if status == "SUCCESS" and (not transcript or not speech_detected):
                  status = "FAILED"
                  transcript = ""
              elif status != "SUCCESS":
                  transcript = ""

              try:
                  confidence = float(value.get("confidence", 0))
              except Exception:
                  confidence = 0
              confidence = max(0, min(1, confidence))

              flags = value.get("flags")
              if not isinstance(flags, list):
                  flags = []
              flags = list(dict.fromkeys(
                  str(flag).strip().upper() for flag in flags if str(flag).strip()
              ))

              return {
                  "stt_result": {
                      "schema_version": 1,
                      "status": status,
                      "transcript": transcript,
                      "detected_language": str(value.get("detected_language") or "").strip().lower(),
                      "speech_detected": speech_detected,
                      "confidence": confidence,
                      "flags": flags,
                  }
              }
        code_language: python3
