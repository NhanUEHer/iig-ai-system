name: Build and deploy containers

on:
  push:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        type: choice
        options: [beta, production]

permissions:
  contents: read
  packages: write

concurrency:
  group: iig-admin-${{ github.event.inputs.environment || (github.ref_name == 'main' && 'production' || 'beta') }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  prepare:
    runs-on: ubuntu-latest
    outputs:
      owner: ${{ steps.meta.outputs.owner }}
      target: ${{ steps.meta.outputs.target }}
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        shell: bash
        run: |
          owner="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          target="${{ github.event.inputs.environment }}"
          if [ -z "$target" ]; then
            if [ "${{ github.ref_name }}" = main ]; then target=production; else target=beta; fi
          fi
          if [ "$target" = production ] && [ "${{ github.ref_name }}" != main ]; then
            echo 'Production deployment is allowed only from main.' >&2
            exit 1
          fi
          if [ "$target" = beta ] && [ "${{ github.ref_name }}" != develop ]; then
            echo 'Beta deployment is allowed only from develop.' >&2
            exit 1
          fi
          prefix=beta
          if [ "$target" = production ]; then prefix=prod; fi
          echo "owner=$owner" >> "$GITHUB_OUTPUT"
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "tag=${prefix}-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          version="$(node -p 'require("./package.json").version')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: [verify, prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        include:
          - name: admin-api
            image: iig-admin-api
            file: Dockerfile
            target: admin-api
          - name: scoring-api
            image: iig-ai-scoring-api
            file: Dockerfile
            target: ai-scoring-api
          - name: scoring-worker
            image: iig-ai-scoring-worker
            file: Dockerfile
            target: ai-scoring-worker
          - name: admin-web
            image: iig-admin-admin-web
            file: frontend/Dockerfile
          - name: exam-web
            image: iig-admin-exam-web
            file: exam-web/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: true
          platforms: linux/arm64
          tags: ghcr.io/${{ needs.prepare.outputs.owner }}/${{ matrix.image }}:${{ needs.prepare.outputs.tag }}
          build-args: |
            VITE_APP_ENV=${{ needs.prepare.outputs.target }}
            VITE_APP_VERSION=${{ needs.prepare.outputs.version }}
            VITE_APP_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy-beta:
    if: github.ref_name == 'develop' || github.event.inputs.environment == 'beta'
    needs: [build, prepare]
    runs-on: ubuntu-latest
    environment: beta
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      - name: Trust deployment host
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' '${{ secrets.VPS_KNOWN_HOSTS }}' > ~/.ssh/known_hosts
      - name: Upload deployment definition
        run: |
          scp -O \
            deploy/docker-compose.yml \
            deploy/docker-compose.beta.yml \
            deploy/nginx-beta.conf \
            scripts/configure-beta-environment.sh \
            scripts/deploy-containers.sh \
            root@${{ secrets.VPS_HOST }}:/opt/iig-admin/beta/
      - name: Stage initial Beta administrator
        env:
          BOOTSTRAP_ADMIN_EMAIL: ${{ secrets.BOOTSTRAP_ADMIN_EMAIL }}
          BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.BOOTSTRAP_ADMIN_PASSWORD }}
        run: |
          test -n "$BOOTSTRAP_ADMIN_EMAIL" || { echo 'Missing Beta environment secret: BOOTSTRAP_ADMIN_EMAIL' >&2; exit 1; }
          test -n "$BOOTSTRAP_ADMIN_PASSWORD" || { echo 'Missing Beta environment secret: BOOTSTRAP_ADMIN_PASSWORD' >&2; exit 1; }
          umask 077
          bootstrap_file="$(mktemp)"
          trap 'rm -f "$bootstrap_file"' EXIT
          printf 'BOOTSTRAP_ADMIN_NAME=%s\n' 'Beta Admin' > "$bootstrap_file"
          printf 'BOOTSTRAP_ADMIN_EMAIL=%s\n' "$BOOTSTRAP_ADMIN_EMAIL" >> "$bootstrap_file"
          printf 'BOOTSTRAP_ADMIN_PASSWORD=%s\n' "$BOOTSTRAP_ADMIN_PASSWORD" >> "$bootstrap_file"
          scp -O "$bootstrap_file" root@${{ secrets.VPS_HOST }}:/opt/iig-admin/beta/.bootstrap-admin.env
      - name: Deploy immutable Beta images
        env:
          IMAGE_TAG: beta-${{ github.sha }}
          APP_COMMIT: ${{ github.sha }}
        run: |
          APP_VERSION="${{ needs.prepare.outputs.version }}"
          ssh root@${{ secrets.VPS_HOST }} "deploy beta $IMAGE_TAG $APP_VERSION $APP_COMMIT"

  deploy-production:
    if: github.ref_name == 'main' || github.event.inputs.environment == 'production'
    needs: [build, prepare]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      - name: Trust deployment host
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' '${{ secrets.VPS_KNOWN_HOSTS }}' > ~/.ssh/known_hosts
      - name: Upload deployment definition
        run: scp -O deploy/docker-compose.yml scripts/deploy-containers.sh root@${{ secrets.VPS_HOST }}:/opt/iig-admin/prod/
      - name: Deploy immutable Production images
        env:
          IMAGE_TAG: prod-${{ github.sha }}
          APP_COMMIT: ${{ github.sha }}
        run: |
          APP_VERSION="${{ needs.prepare.outputs.version }}"
          ssh root@${{ secrets.VPS_HOST }} "deploy production $IMAGE_TAG $APP_VERSION $APP_COMMIT"
