name: Promote Beta to Production

# CI/CD v2: Production receives exactly the images running on Beta (no rebuild). Requires the
# `production` environment approval. Moves only components whose digest differs from Production,
# tags v<version>, fast-forwards main to the Beta commit and records a GitHub Release manifest.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (X.Y.Z)
        required: true
      redeploy_api:
        description: Redeploy admin-api even if its image is unchanged (picks up new runtime config such as ai-core.env)
        type: boolean
        default: false

permissions:
  contents: write
  packages: write
  actions: read

concurrency:
  group: iig-admin-production
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "version must be X.Y.Z" >&2; exit 1; }
          if git ls-remote --exit-code --tags "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists; choose a new version" >&2; exit 1
          fi
      - name: Beta commit (last successful Beta release)
        id: commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha="$(gh run list -R "$GITHUB_REPOSITORY" -w release.yml -b develop --status success -L 1 --json headSha -q '.[0].headSha')"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "No successful Beta release found" >&2; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.commit.outputs.sha }}
          fetch-depth: 0
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      - name: Trust deployment host
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' '${{ secrets.VPS_KNOWN_HOSTS }}' > ~/.ssh/known_hosts
      - name: Read running manifests
        id: m
        run: |
          set -euo pipefail
          beta="$(ssh root@${{ secrets.VPS_HOST }} 'manifest beta')"; prod="$(ssh root@${{ secrets.VPS_HOST }} 'manifest production')"
          echo "beta=$beta"; echo "prod=$prod"
          { echo "beta=$beta"; echo "prod=$prod"; } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Retag Beta digests for Production (no rebuild)
        id: retag
        env:
          BETA: ${{ steps.m.outputs.beta }}
          PROD: ${{ steps.m.outputs.prod }}
          REDEPLOY_API: ${{ inputs.redeploy_api }}
          COMMIT: ${{ steps.commit.outputs.sha }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          components=()
          for svc in admin-api admin-web exam-web; do
            b="$(jq -r --arg s "$svc" '.[$s]' <<<"$BETA")"; p="$(jq -r --arg s "$svc" '.[$s]' <<<"$PROD")"
            [[ "$b" == *@sha256:* ]] || { echo "Beta $svc has no registry digest" >&2; exit 1; }
            if [ "${b#*@}" != "${p#*@}" ] || { [ "$svc" = admin-api ] && [ "${REDEPLOY_API:-false}" = true ]; }; then
              repo="${b%@*}"
              docker buildx imagetools create -t "$repo:prod-$COMMIT" -t "$repo:v$VERSION" "$b"
              components+=("$svc")
            fi
          done
          list="$(IFS=,; echo "${components[*]}")"
          echo "Components to promote: ${list:-none}"; echo "components=$list" >> "$GITHUB_OUTPUT"
      - name: Prepare AI Core runtime env
        # AI Core master key + Content Studio provider come from the production GitHub environment
        # (secret AI_CORE_MASTER_KEY, variable CONTENT_STUDIO_PROVIDER). Unset values are left out,
        # so the API keeps running with AI Core unconfigured and Content Studio on the mock provider.
        env:
          AI_CORE_MASTER_KEY: ${{ secrets.AI_CORE_MASTER_KEY }}
          CONTENT_STUDIO_PROVIDER: ${{ vars.CONTENT_STUDIO_PROVIDER }}
        run: |
          install -m 600 /dev/null ai-core.env
          if [ -n "$AI_CORE_MASTER_KEY" ]; then printf 'AI_CORE_MASTER_KEY=%s\n' "$AI_CORE_MASTER_KEY" >> ai-core.env; fi
          if [ -n "$CONTENT_STUDIO_PROVIDER" ]; then printf 'CONTENT_STUDIO_PROVIDER=%s\n' "$CONTENT_STUDIO_PROVIDER" >> ai-core.env; fi
      - name: Deploy Production (changed components only)
        if: steps.retag.outputs.components != ''
        env:
          COMPONENTS: ${{ steps.retag.outputs.components }}
          COMMIT: ${{ steps.commit.outputs.sha }}
          VERSION: ${{ inputs.version }}
        run: |
          scp -O ai-core.env deploy/docker-compose.yml scripts/deploy-containers.sh root@${{ secrets.VPS_HOST }}:/opt/iig-admin/prod/
          ssh root@${{ secrets.VPS_HOST }} "deploy production prod-$COMMIT $VERSION $COMMIT $COMPONENTS"
      - name: Tag, fast-forward main, record release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ steps.commit.outputs.sha }}
          BETA: ${{ steps.m.outputs.beta }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Production release v$VERSION" "$COMMIT"; git push origin "v$VERSION"
          git push origin "$COMMIT:refs/heads/main" || echo "::warning::main could not be fast-forwarded to $COMMIT"
          manifest="$(jq -c --arg v "$VERSION" --arg c "$COMMIT" --arg t "$(date -u +%FT%TZ)" '. + {version:$v, commit:$c, deployedAt:$t}' <<<"$BETA")"
          printf 'Promoted from Beta (no rebuild).\n\nManifest:\n%s\n' "$manifest" > release-notes.md
          gh release create "v$VERSION" --title "v$VERSION" --target "$COMMIT" --notes-file release-notes.md
