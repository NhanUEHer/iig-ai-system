name: CI

# CI/CD v2: pull requests only. `changes` selects affected components; each check runs only
# when its component changed. `ci-summary` is the single required status.
on:
  pull_request:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.changes.outputs.matrix }}
      has_changes: ${{ steps.changes.outputs.has_changes }}
      backend: ${{ steps.changes.outputs.backend }}
      admin_web: ${{ steps.changes.outputs.admin_web }}
      exam_web: ${{ steps.changes.outputs.exam_web }}
      image_inputs: ${{ steps.changes.outputs.image_inputs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then BASE_SHA=""; fi
          node scripts/ci/changed-components.mjs "$BASE_SHA" HEAD | tee -a "$GITHUB_OUTPUT"

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - run: npm ci
      - run: npm run check:syntax
      - run: npm test

  admin-web:
    needs: changes
    if: needs.changes.outputs.admin_web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run lint --prefix frontend
      - run: npm run build --prefix frontend

  exam-web:
    needs: changes
    if: needs.changes.outputs.exam_web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: exam-web/package-lock.json
      - run: npm ci --prefix exam-web
      - run: npm run build --prefix exam-web

  docker-build:
    # Image build check only when an image's Dockerfile/dependency inputs changed (or weekly).
    needs: changes
    if: needs.changes.outputs.has_changes == 'true' && (needs.changes.outputs.image_inputs == 'true' || github.event_name != 'pull_request')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: false
          platforms: linux/arm64
          cache-from: type=gha,scope=${{ matrix.name }}-arm64
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}-arm64

  ci-summary:
    needs: [changes, backend, admin-web, exam-web, docker-build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All selected checks passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do case "$r" in success|skipped) ;; *) exit 1 ;; esac; done
